name: 'Pipe (SPR)'
description: 'Run Pipe scripts in CI/CD — Semantic Pipeline Runtime with built-in AI'
author: 'MachuraHarry'
branding:
  icon: 'terminal'
  color: 'purple'

inputs:
  script:
    description: 'Pipe script to execute (write to .pipe file or inline)'
    required: true
  version:
    description: 'Pipe version'
    required: false
    default: 'latest'
  flags:
    description: 'Additional flags'
    required: false
    default: '-vm -q'
  provider:
    description: 'AI provider'
    required: false

runs:
  using: 'composite'
  steps:
    - run: bash $GITHUB_ACTION_PATH/run.sh
      shell: bash
      env:
        PIPE_SCRIPT: ${{ inputs.script }}
        PIPE_PROVIDER: ${{ inputs.provider }}
        PIPE_FLAGS: ${{ inputs.flags }}
        PIPE_VERSION: ${{ inputs.version }}
