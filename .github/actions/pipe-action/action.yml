name: 'Pipe (SPR)'
description: 'Run Pipe scripts in CI/CD — Semantic Pipeline Runtime with built-in AI'
author: 'MachuraHarry'
branding:
  icon: 'terminal'
  color: 'purple'

inputs:
  script:
    description: 'Pipe script to execute'
    required: true
  version:
    description: 'Pipe version (default: latest)'
    required: false
    default: 'latest'
  flags:
    description: 'Additional flags (-vm, -q, --sandbox)'
    required: false
    default: '-vm -q'
  provider:
    description: 'AI provider (openai, anthropic, deepseek, ollama)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Write Script
      shell: bash
      run: |
        python3 -c "
import sys
with open('/tmp/pipe-script','w') as f:
    f.write(sys.argv[1])
" '${{ inputs.script }}'

    - name: Download Pipe
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -e
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        [ "$ARCH" = "x86_64" ] && ARCH="amd64"
        [ "$ARCH" = "aarch64" ] && ARCH="arm64"
        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/MachuraHarry/pipe/releases/latest/download/pipe-${OS}-${ARCH}.tar.gz"
        else
          URL="https://github.com/MachuraHarry/pipe/releases/download/${VERSION}/pipe-${OS}-${ARCH}.tar.gz"
        fi
        if curl -fsSL "$URL" -o pipe.tar.gz 2>/dev/null; then
          tar -xzf pipe.tar.gz && rm pipe.tar.gz
        else
          TMP=$(mktemp -d)
          git clone --depth 1 https://github.com/MachuraHarry/pipe "$TMP"
          cd "$TMP" && go build -o pipe ./cmd/pipe && mv pipe "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE" && rm -rf "$TMP"
        fi
        chmod +x pipe
        echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

    - name: Run Pipe
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        FLAGS: ${{ inputs.flags }}
      run: |
        [ -n "$PROVIDER" ] && sed -i "1i ai_provider \"$PROVIDER\"" /tmp/pipe-script || true
        echo "=== Pipe Script ==="
        cat /tmp/pipe-script
        echo "===================="
        pipe $FLAGS /tmp/pipe-script
