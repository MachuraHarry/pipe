name: 'Pipe (SPR)'
description: 'Run Pipe scripts in CI/CD — Semantic Pipeline Runtime with built-in AI'
author: 'MachuraHarry'
branding:
  icon: 'terminal'
  color: 'purple'

inputs:
  script:
    description: 'Pipe script to execute'
    required: true
  version:
    description: 'Pipe version (default: latest)'
    required: false
    default: 'latest'
  flags:
    description: 'Additional flags (-vm, -q, --sandbox)'
    required: false
    default: '-vm -q'
  provider:
    description: 'AI provider (openai, anthropic, deepseek, ollama)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run Pipe
      shell: bash
      env:
        PIPE_SCRIPT: ${{ inputs.script }}
        PIPE_PROVIDER: ${{ inputs.provider }}
        PIPE_FLAGS: ${{ inputs.flags }}
      run: |
        printf '%s\n' "$PIPE_SCRIPT" | bash "$GITHUB_ACTION_PATH/run.sh"
