name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Format check
      run: test -z "$(gofmt -l .)"

    - name: Install sqlite module (so parity tests do not skip)
      run: |
        go build -o /tmp/pipe-install ./cmd/pipe
        /tmp/pipe-install -get sqlite

    - name: Test
      run: go test -v -race -cover ./pkg/...

    - name: Build
      run: go build -v ./cmd/pipe

    - name: Integration tests
      run: |
        go build -o /tmp/pipe ./cmd/pipe
        cd test/integration && /tmp/pipe -test

  stats:
    name: Stats drift check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Regenerate stats.json
      run: go run ./scripts/stats

    - name: Fail on drift from committed stats/docs
      run: |
        if ! git diff --exit-code -- stats.json README.md website/index.html website/docs.html; then
          echo "::error::stats/docs drifted from the committed snapshot. Run 'make stats' and commit the updated stats.json, README and website files."
          exit 1
        fi
        echo "stats and docs in sync"

  docs-smoke:
    name: pipe-docs RAG smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build pipe
      run: go build -o /tmp/pipe ./cmd/pipe

    - name: Install docs-pipe + sqlite modules
      run: |
        /tmp/pipe -get docs-pipe
        /tmp/pipe -get sqlite

    - name: Run RAG smoke test
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: |
        set +e
        OUT=$(/tmp/pipe scripts/pipe-docs-smoke.pipe 2>&1)
        RC=$?
        set -e
        echo "$OUT"
        echo "pipe exit code: $RC"
        if echo "$OUT" | grep -q "ERROR"; then
          echo "::error::pipe-docs RAG smoke test failed"
          exit 1
        fi
        if [ $RC -ne 0 ] && ! echo "$OUT" | grep -q "SKIP"; then
          echo "::error::pipe-docs RAG smoke test crashed (exit=$RC)"
          exit 1
        fi
        if echo "$OUT" | grep -q "OK"; then
          echo "pipe-docs RAG smoke test passed"
        else
          echo "pipe-docs RAG smoke test skipped (no DEEPSEEK_API_KEY or provider unavailable)"
        fi

  byte-identity:
    name: Byte-identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build pipe
      shell: bash
      run: |
        go build -o "$RUNNER_TEMP/pipe" ./cmd/pipe
        PIPE="$RUNNER_TEMP/pipe"
        [ -f "$PIPE.exe" ] && PIPE="$PIPE.exe"
        echo "PIPE=$PIPE" >> "$GITHUB_ENV"

    - name: Generate fixture repo
      shell: bash
      run: bash test/fixtures/fluencyloop/make-fixture.sh "$RUNNER_TEMP/fixture"

    - name: Run pipe slice-context (--json)
      shell: bash
      run: |
        cd "$RUNNER_TEMP/fixture"
        "$PIPE" "$GITHUB_WORKSPACE/examples/fluencyloop-slice-context.pipe" --json > "$RUNNER_TEMP/pipe.json"

    - name: Run bash reference (--json)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd "$RUNNER_TEMP/fixture"
        bash "$GITHUB_WORKSPACE/test/fixtures/fluencyloop/slice-context.sh" --json > "$RUNNER_TEMP/ref.json"

    - name: Stage outputs
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/out"
        cp "$RUNNER_TEMP/pipe.json" "$RUNNER_TEMP/out/pipe.json"
        if [ -f "$RUNNER_TEMP/ref.json" ]; then
          cp "$RUNNER_TEMP/ref.json" "$RUNNER_TEMP/out/ref.json"
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: byte-identity-${{ matrix.os }}
        path: ${{ runner.temp }}/out

  compare-byte-identity:
    name: Compare byte-identity
    needs: byte-identity
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: byte-identity-ubuntu-latest
        path: linux

    - uses: actions/download-artifact@v4
      with:
        name: byte-identity-windows-latest
        path: windows

    - name: Compare outputs
      run: |
        cmp linux/ref.json linux/pipe.json
        cmp linux/pipe.json windows/pipe.json
        echo "Byte-identity verified: bash reference == Linux pipe == Windows pipe"
