name: Deploy API

on:
  push:
    branches: [master]
    paths: ['cmd/api-server/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --dockerfile cmd/api-server/Dockerfile --config cmd/api-server/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
