name: Pipe — Live Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-demo.yml'

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Generate Release Notes
        uses: ./.github/actions/pipe-action
        with:
          script: |
            print "=== Git Log ==="
            log: exec "git log --oneline -10"
            print (get log "output")

            print ""
            print "=== Stats ==="
            stats: exec "git log --oneline -10 | wc -l"
            print ("Commits: " ++ trim (get stats "output"))

            print ""
            print "=== Current Date ==="
            ts: now 0
            print (format_time ts "2006-01-02 15:04:05")

      - name: Save Output
        run: |
          echo "Generated by Pipe (SPR) in GitHub Actions" >> demo_output.txt
          echo "Timestamp: $(date)" >> demo_output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pipe-demo-output
          path: demo_output.txt
