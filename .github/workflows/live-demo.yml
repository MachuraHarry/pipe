name: Pipe — Live Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-demo.yml'

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30

      - name: Generate Release Notes
        uses: ./.github/actions/pipe-action
        with:
          script: |
            write_file "/tmp/pipe_output.txt" "=== Pipe Demo Output ===\n\n"

            print "=== Git Log ==="
            log: exec "git log --oneline -10"
            print (get log "output")

            print ""
            print "=== Stats ==="
            stats: exec "git log --oneline -10 | wc -l"
            print ("Commits: " ++ trim (get stats "output"))

            print ""
            print "=== Current Date ==="
            ts: now
            print (format_time ts "2006-01-02 15:04:05")

      - uses: actions/upload-artifact@v4
        with:
          name: pipe-logs
          path: /tmp/pipe_output.txt
