name: Telegram-Notify

on:
  push:
    branches: [master]
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Pipe aus Source bauen (Compiler-Fix aus diesem Repo)
        run: go build -o /tmp/pipe ./cmd/pipe
      - name: Telegram-Benachrichtigung + KI-Review senden
        run: /tmp/pipe -vm scripts/notify_telegram.pipe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '8288410155'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
