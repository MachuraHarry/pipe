name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '0 6 * * *'  # daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build WebAssembly
      run: |
        GOOS=js GOARCH=wasm go build -trimpath -o website/pipe.wasm ./cmd/wasm
        gzip -9 -kf website/pipe.wasm

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Generate blog pages, sitemap and RSS feed
      run: python3 website/bloggen.py

    - name: Copy docs for in-site viewing
      run: cp -r docs website/docs

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: website

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
