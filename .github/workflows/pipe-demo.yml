name: Pipe Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/actions/pipe-action/**'
      - '.github/workflows/pipe-demo.yml'

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipe-action
        with:
          script: |
            print "Hello from GitHub Actions!"
            print "Pipe (SPR) running in CI/CD."
            print (2 + 2)
