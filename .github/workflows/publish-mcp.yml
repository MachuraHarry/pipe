name: Publish MCP Registry (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (default: v0.9.3.5)'
        required: false
        default: 'v0.9.3.5'
      skip-publish:
        description: 'Skip publishing and only manage version status'
        required: false
        default: 'false'
      deprecate-old:
        description: 'Deprecate all previously active versions of the server'
        required: false
        default: 'true'
      set-status:
        description: 'Manually set a version status: "<active|deprecated> <version>" (e.g. "active 0.9.3")'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
        ./mcp-publisher --help >/dev/null

    - name: Check if version already published
      id: registry-check
      env:
        VERSION: ${{ inputs.tag }}
      run: |
        VERSION="${VERSION#v}"
        PUBLISHED=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers/io.github.MachuraHarry%2Fpipe/versions" \
          | jq -r --arg v "$VERSION" \
            '.servers[] | select(.server.version == $v) | .server.version' | head -1)
        if [ -n "$PUBLISHED" ]; then
          echo "Version ${VERSION} is already published in the registry — skipping publish."
          echo "already_published=true" >> "$GITHUB_OUTPUT"
        else
          echo "Version ${VERSION} is new — will publish."
          echo "already_published=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download MCPB assets
      if: inputs.skip-publish == 'false' && steps.registry-check.outputs.already_published == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        for p in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
          gh release download "$TAG" -p "pipe-server-$p.mcpb" -R "${{ github.repository }}"
        done

    - name: Update server.json
      if: inputs.skip-publish == 'false' && steps.registry-check.outputs.already_published == 'false'
      env:
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      run: |
        VERSION="${TAG#v}"
        H="https://github.com/$REPO/releases/download/$TAG"
        h0=$(openssl dgst -sha256 -r pipe-server-linux-amd64.mcpb | awk '{print $1}')
        h1=$(openssl dgst -sha256 -r pipe-server-linux-arm64.mcpb | awk '{print $1}')
        h2=$(openssl dgst -sha256 -r pipe-server-darwin-amd64.mcpb | awk '{print $1}')
        h3=$(openssl dgst -sha256 -r pipe-server-darwin-arm64.mcpb | awk '{print $1}')
        h4=$(openssl dgst -sha256 -r pipe-server-windows-amd64.mcpb | awk '{print $1}')
        jq \
          --arg v "$VERSION" \
          --arg h "$H" \
          --arg a "$h0" --arg b "$h1" --arg c "$h2" --arg d "$h3" --arg e "$h4" \
          '.version = $v
           | .packages[0].identifier = ($h + "/pipe-server-linux-amd64.mcpb")  | .packages[0].fileSha256 = $a
           | .packages[1].identifier = ($h + "/pipe-server-linux-arm64.mcpb")  | .packages[1].fileSha256 = $b
           | .packages[2].identifier = ($h + "/pipe-server-darwin-amd64.mcpb") | .packages[2].fileSha256 = $c
           | .packages[3].identifier = ($h + "/pipe-server-darwin-arm64.mcpb") | .packages[3].fileSha256 = $d
           | .packages[4].identifier = ($h + "/pipe-server-windows-amd64.mcpb") | .packages[4].fileSha256 = $e' \
          server.json > server.json.tmp && mv server.json.tmp server.json
        cat server.json

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    - name: Set version status
      if: inputs.set-status != ''
      env:
        SET_STATUS: ${{ inputs.set-status }}
        SERVER: io.github.MachuraHarry/pipe
      run: |
        read -r ST VAL <<< "$SET_STATUS"
        echo "Setting ${SERVER} ${VAL} to ${ST}..."
        ./mcp-publisher status --status "$ST" "$SERVER" "$VAL"

    - name: Publish to MCP Registry
      if: inputs.skip-publish == 'false' && steps.registry-check.outputs.already_published == 'false'
      run: ./mcp-publisher publish

    - name: Deprecate previous versions
      if: inputs.deprecate-old == 'true'
      env:
        TAG: ${{ inputs.tag }}
        SERVER: io.github.MachuraHarry/pipe
      run: |
        VERSION="${TAG#v}"
        echo "Deprecating active versions of ${SERVER} other than ${VERSION}..."
        OLD=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers/io.github.MachuraHarry%2Fpipe/versions" \
          | jq -r --arg keep "$VERSION" \
            '.servers[]
             | select((._meta["io.modelcontextprotocol.registry/official"].status // "") == "active")
             | select(.server.version != $keep)
             | .server.version')
        if [ -z "$OLD" ]; then
          echo "No previous active versions to deprecate."
        else
          for v in $OLD; do
            echo "Deprecating ${SERVER} ${v}..."
            ./mcp-publisher status --status deprecated "$SERVER" "$v"
          done
        fi
