name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux,   arch: amd64, ext: '' }
          - { os: linux,   arch: arm64, ext: '' }
          - { os: darwin,  arch: amd64, ext: '' }
          - { os: darwin,  arch: arm64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      env:
        GOOS: ${{ matrix.target.os }}
        GOARCH: ${{ matrix.target.arch }}
      run: |
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -trimpath -o pipe${{ matrix.target.ext }} ./cmd/pipe
        tar -czf pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz pipe${{ matrix.target.ext }}
        sha256sum pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz > pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}
        path: pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*
        generate_release_notes: true
