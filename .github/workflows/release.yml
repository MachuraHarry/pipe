name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux,   arch: amd64, ext: '' }
          - { os: linux,   arch: arm64, ext: '' }
          - { os: darwin,  arch: amd64, ext: '' }
          - { os: darwin,  arch: arm64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build
      env:
        GOOS: ${{ matrix.target.os }}
        GOARCH: ${{ matrix.target.arch }}
        CGO_ENABLED: '0'
      run: |
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -trimpath -o pipe${{ matrix.target.ext }} ./cmd/pipe
        tar -czf pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz pipe${{ matrix.target.ext }}
        sha256sum pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz > pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz.sha256

    - name: Build MCPB bundle
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p bundle/server
        cp pipe${{ matrix.target.ext }} bundle/server/pipe${{ matrix.target.ext }}
        cp examples/mcp_server.pipe bundle/server/mcp_server.pipe
        cp mcpb/manifest.json bundle/manifest.json
        sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" bundle/manifest.json
        if [ "${{ matrix.target.os }}" = "windows" ]; then
          sed -i 's|server/pipe"|server/pipe.exe"|g' bundle/manifest.json
        fi
        chmod +x bundle/server/pipe${{ matrix.target.ext }}
        npx -y @anthropic-ai/mcpb pack bundle pipe-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb
        openssl dgst -sha256 -r pipe-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb | awk '{print $1}' > pipe-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb.sha256

    - name: Build Docs MCPB bundle
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p bundle-docs/server
        cp pipe${{ matrix.target.ext }} bundle-docs/server/pipe${{ matrix.target.ext }}
        cp examples/pipe_docs_server.pipe bundle-docs/server/pipe_docs_server.pipe
        cp mcpb/manifest-docs.json bundle-docs/manifest.json
        sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" bundle-docs/manifest.json
        if [ "${{ matrix.target.os }}" = "windows" ]; then
          sed -i 's|server/pipe"|server/pipe.exe"|g' bundle-docs/manifest.json
        fi
        chmod +x bundle-docs/server/pipe${{ matrix.target.ext }}
        npx -y @anthropic-ai/mcpb pack bundle-docs pipe-docs-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb
        openssl dgst -sha256 -r pipe-docs-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb | awk '{print $1}' > pipe-docs-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}
        path: |
          pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*
          pipe-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb*
          pipe-docs-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          pipe-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*
          pipe-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb*
          pipe-docs-server-${{ matrix.target.os }}-${{ matrix.target.arch }}.mcpb*
        generate_release_notes: true
