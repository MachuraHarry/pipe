name: Telegram-Bot

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Telegram pollen + Commands beantworten
        uses: ./.github/actions/pipe-action
        with:
          file: scripts/telegram_bot.pipe
          version: v0.9.3.5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          ALLOWED_USERS: 'MachuraHarry'
          ALLOWED_CHATS: '8288410155'
          STATE_ISSUE: '3'
