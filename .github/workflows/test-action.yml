name: Test pipe-action

on:
  push:
    paths: ['.github/actions/pipe-action/**', '.github/workflows/test-action.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hello World
        uses: ./.github/actions/pipe-action
        with:
          script: print "pipe-action works!"

      - name: Math
        uses: ./.github/actions/pipe-action
        with:
          script: print (1 + 2 + 3 + 4 + 5)

      - name: Pinned version
        uses: ./.github/actions/pipe-action
        with:
          version: 'v0.9.0'
          script: print "pinned v0.9.0 binary works"

      - name: Sandbox
        uses: ./.github/actions/pipe-action
        with:
          flags: '--sandbox -vm -q'
          script: print "sandbox active"
