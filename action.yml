name: 'Pipe (SPR)'
description: 'Run Pipe scripts in CI/CD — Semantic Pipeline Runtime with built-in AI, MCP server + client'

inputs:
  script:
    description: 'Inline Pipe script to execute'
    required: false
  file:
    description: 'Path to a .pipe file in the repo to execute (instead of an inline script)'
    required: false
  flags:
    description: 'Additional flags'
    required: false
    default: '-vm -q'
  version:
    description: 'Pipe version to use (latest or a release tag like v0.8.0)'
    required: false
    default: 'latest'
  provider:
    description: 'AI provider (injected via --ai-provider when a file is used)'
    required: false

runs:
  using: 'composite'
  steps:
    - shell: bash
      run: bash "$GITHUB_ACTION_PATH/.github/actions/pipe-action/run.sh"
      env:
        PIPE_SCRIPT: ${{ inputs.script }}
        PIPE_FILE: ${{ inputs.file }}
        PIPE_FLAGS: ${{ inputs.flags }}
        PIPE_VERSION: ${{ inputs.version }}
        PIPE_PROVIDER: ${{ inputs.provider }}

branding:
  icon: 'cpu'
  color: 'purple'
