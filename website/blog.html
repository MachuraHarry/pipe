<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Pipe (SPR) blog: updates, tutorials, and deep dives.">
<meta property="og:title" content="Pipe Blog — Semantic Pipeline Runtime">
<meta property="og:description" content="Updates, tutorials, and deep dives into Pipe.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pipe-lang.com/og-image.png">
<meta property="og:url" content="https://pipe-lang.com/blog.html">
<link rel="canonical" href="https://pipe-lang.com/blog.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Pipe Blog RSS" href="feed.xml">
<title>Blog — Pipe</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070c;--bg2:#0d0d16;--bg3:#141420;--card:#11111c;
  --fg:#e8e8f0;--fg2:#9090a8;--fg3:#606078;
  --accent:#a855f7;--accent2:#7c3aed;--green:#3ce096;--orange:#c084fc;--red:#fc5c7c;
  --border:#1e1e2e;--radius:10px;
  --mono:'JetBrains Mono','Fira Code',monospace;--sans:system-ui,-apple-system,sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;padding-top:64px;min-height:100vh;display:flex;flex-direction:column}
.container{max-width:820px;margin:0 auto;padding:0 20px}
nav{position:fixed;top:0;z-index:100;width:100%;background:rgba(7,7,12,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 0}
nav .container{display:flex;justify-content:space-between;align-items:center}
nav .logo{font-weight:800;font-size:1.2rem;color:var(--accent);text-decoration:none;letter-spacing:-0.5px;display:flex;align-items:center}
nav .logo img{height:28px;margin-right:6px}
nav .logo span{color:var(--fg)}
nav .nav-links{display:flex;align-items:center;gap:14px}
nav a{color:var(--fg2);text-decoration:none;font-size:0.82rem;transition:color .2s;white-space:nowrap}
nav a:hover{color:var(--fg)}
.hamburger{display:none;background:none;border:none;color:var(--fg);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.lang-switch{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.lang-switch button{background:none;border:none;color:var(--fg2);padding:4px 10px;font-size:0.72rem;cursor:pointer;font-weight:600;transition:all .2s}
.lang-switch button.active{background:var(--accent);color:#fff}
[data-lang]{display:none}
[data-lang].active{display:inline}
h1[data-lang].active,h2[data-lang].active,p[data-lang].active,div[data-lang].active{display:block}

main{flex:1;padding:40px 0}
main h1{font-size:2rem;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px}
main .subtitle{color:var(--fg2);margin-bottom:36px;font-size:0.9rem}

.post-list{display:flex;flex-direction:column;gap:20px}
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:border-color .2s,transform .15s;cursor:pointer}
.post-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.post-card .post-date{font-size:0.72rem;color:var(--accent);font-family:var(--mono);margin-bottom:6px}
.post-card .post-title{font-size:1.2rem;font-weight:700;margin-bottom:8px;color:var(--fg)}
.post-card .post-excerpt{font-size:0.85rem;color:var(--fg2);line-height:1.6}

.post-detail .back-link{display:inline-block;margin-bottom:20px;color:var(--accent);font-size:0.82rem;text-decoration:none}
.post-detail .back-link:hover{text-decoration:underline}

/* rendered markdown */
.doc-body h1{font-size:1.8rem;font-weight:800;margin-bottom:8px}
.doc-body h2{font-size:1.3rem;font-weight:700;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.doc-body h3{font-size:1.05rem;font-weight:700;margin:24px 0 8px;color:var(--accent2)}
.doc-body p{margin-bottom:12px;font-size:0.9rem;line-height:1.7}
.doc-body ul,.doc-body ol{margin-bottom:12px;padding-left:22px}
.doc-body li{font-size:0.9rem;margin-bottom:4px}
.doc-body a{color:var(--accent);text-decoration:none}
.doc-body a:hover{text-decoration:underline}
.doc-body strong{font-weight:700;color:var(--orange)}
.doc-body code{background:var(--bg3);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:0.83em;color:var(--accent2)}
.doc-body pre{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;overflow-x:auto;margin-bottom:14px}
.doc-body pre code{background:none;padding:0;font-size:0.82rem;color:var(--fg)}
.doc-body table{border-collapse:collapse;width:100%;margin-bottom:16px;font-size:0.85rem}
.doc-body th{background:var(--bg2);border:1px solid var(--border);padding:8px 12px;text-align:left;font-weight:600}
.doc-body td{border:1px solid var(--border);padding:8px 12px}
.doc-body blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin-bottom:12px;background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0;color:var(--fg2);font-size:0.88rem}
.doc-body hr{border:none;border-top:1px solid var(--border);margin:32px 0}

footer{background:var(--bg2);border-top:1px solid var(--border);padding:24px 0;text-align:center;color:var(--fg3);font-size:0.75rem;margin-top:auto}

@media(max-width:768px){
  .hamburger{display:block}
  nav .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(7,7,12,0.98);border-bottom:1px solid var(--border);flex-direction:column;padding:16px 20px;gap:12px;backdrop-filter:blur(12px)}
  nav .nav-links.open{display:flex}
  main h1{font-size:1.5rem}
}
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="index.html" class="logo"><img src="logo.svg" alt="Pipe">Pipe<span>.lang</span></a>
    <button class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('open')">☰</button>
    <div class="nav-links" id="nav-menu">
      <a href="index.html"><span data-lang="en" class="active">Home</span><span data-lang="de">Start</span></a>
      <a href="docs.html"><span data-lang="en" class="active">Docs</span><span data-lang="de">Doku</span></a>
      <a href="examples.html">Examples</a>
      <a href="install.html">Install</a>
      <a href="benchmarks.html">Benchmarks</a>
      <a href="playground.html">Playground</a>
      <a href="blog.html">Blog</a>
      <a href="https://github.com/MachuraHarry/pipe">GitHub</a>
      <div class="lang-switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <button id="btn-de" onclick="setLang('de')">DE</button>
      </div>
    </div>
  </div>
</nav>

<main id="main-content">
  <div class="container" id="post-list"><div style="text-align:center;color:var(--fg2);padding-top:60px">Loading…</div></div>
</main>

<footer>© 2026 Pipe (SPR) · MIT License · <a href="feed.xml" style="color:var(--accent)">RSS</a></footer>

<script>
var currentLang = 'en';

function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('[data-lang]').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('[data-lang="'+lang+'"]').forEach(function(e){e.classList.add('active')});
  document.getElementById('btn-en').classList.toggle('active',lang==='en');
  document.getElementById('btn-de').classList.toggle('active',lang==='de');
  document.documentElement.lang=lang;
  localStorage.setItem('pipe-lang',lang);
  renderPostList();
}

function renderPostList(){
  var el=document.getElementById('post-list');
  var lang=currentLang;
  el.innerHTML='<h1>'+L.blogTitle[lang]+'</h1><p class="subtitle">'+L.blogSub[lang]+'</p><div class="post-list">'+postData.map(function(p,i){
    return '<div class="post-card" onclick="showPost(\''+p.id+'\')">'+
      '<div class="post-date">'+p.date+'</div>'+
      '<div class="post-title">'+p.title[lang]+'</div>'+
      '<div class="post-excerpt">'+p.excerpt[lang]+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

function showPost(id){
  var p=postData.find(function(x){return x.id===id;});
  if(!p) return;
  var el=document.getElementById('post-list');
  el.innerHTML='<div class="post-detail"><a class="back-link" href="javascript:void(0)" onclick="renderPostList()">← '+L.back[lang]+'</a><div style="color:var(--fg2);padding:40px 0">'+L.loading[lang]+'</div></div>';

  fetch('blog/'+p.file).then(function(r){return r.text()}).then(function(md){
    var html=renderMarkdown(md);
    el.innerHTML='<div class="post-detail"><a class="back-link" href="javascript:void(0)" onclick="renderPostList()">← '+L.back[lang]+'</a><div class="post-date" style="font-size:0.72rem;color:var(--accent);font-family:var(--mono);margin-bottom:8px">'+p.date+'</div><div class="doc-body">'+html+'</div></div>';
    history.replaceState(null,'','?post='+id);
  }).catch(function(e){
    el.innerHTML='<div class="post-detail"><a class="back-link" href="javascript:void(0)" onclick="renderPostList()">← '+L.back[lang]+'</a><p style="color:var(--red)">'+L.loadErr[lang]+'</p></div>';
  });
}

// ---- Markdown ----
function renderMarkdown(t){t=t.replace(/</g,'&lt;').replace(/>/g,'&gt;');var o=[],l=t.split('\n'),i=0;
while(i<l.length){var ln=l[i];
if(ln.match(/^```/)){i++;var cl=[];while(i<l.length&&!l[i].match(/^```/)){cl.push(l[i]);i++}i++;o.push('<pre><code>'+cl.join('\n')+'</code></pre>');continue}
var mh=ln.match(/^(#{1,6})\s+(.+)/);if(mh){o.push('<h'+mh[1].length+'>'+inline(mh[2])+'</h'+mh[1].length+'>');i++;continue}
if(ln.match(/^---/)){o.push('<hr>');i++;continue}
if(ln.match(/^> /)){var ql=[];while(i<l.length&&l[i].match(/^> /)){ql.push(l[i].slice(2));i++}o.push('<blockquote>'+inline(ql.join('\n'))+'</blockquote>');continue}
if(ln.indexOf('|')>=0&&i+1<l.length&&l[i+1].match(/^\|[\s\-:|]+\|$/)){var hr=ln;i+=2;var br=[];while(i<l.length&&l[i].trim().indexOf('|')>=0){br.push(l[i]);i++}
var hcs=hr.split('|').filter(function(c){return c.trim()}),ths='';for(var hi=0;hi<hcs.length;hi++)ths+='<th>'+inline(hcs[hi].trim())+'</th>';
var tbd='';for(var ri=0;ri<br.length;ri++){var bcs=br[ri].split('|').filter(function(c){return c.trim()}),tr='';for(var bi=0;bi<bcs.length;bi++)tr+='<td>'+inline(bcs[bi].trim())+'</td>';tbd+='<tr>'+tr+'</tr>'}
o.push('<table><thead><tr>'+ths+'</tr></thead><tbody>'+tbd+'</tbody></table>');continue}
if(ln.match(/^[\-\*\+]\s+/)){var it=[];while(i<l.length&&l[i].match(/^[\-\*\+]\s+/)){it.push(l[i].replace(/^[\-\*\+]\s+/,''));i++}var lb='';for(var li=0;li<it.length;li++)lb+='<li>'+inline(it[li])+'</li>';o.push('<ul>'+lb+'</ul>');continue}
if(ln.match(/^\d+\.\s+/)){var oi=[];while(i<l.length&&l[i].match(/^\d+\.\s+/)){oi.push(l[i].replace(/^\d+\.\s+/,''));i++}var ob='';for(var oj=0;oj<oi.length;oj++)ob+='<li>'+inline(oi[oj])+'</li>';o.push('<ol>'+ob+'</ol>');continue}
if(ln.trim()===''){i++;continue}
var pl=[];while(i<l.length&&l[i].trim()!==''&&!l[i].match(/^(#{1,6}\s|^> |^```|^[\-\*\+]\s|^\d+\.\s|^---|^\|)/)){pl.push(l[i]);i++}if(pl.length)o.push('<p>'+inline(pl.join(' '))+'</p>')
}return o.join('\n')}
function inline(t){t=t.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/`([^`]+)`/g,'<code>$1</code>');t=t.replace(/~~(.+?)~~/g,'<del>$1</del>');t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');return t}

// ---- i18n ----
var L={blogTitle:{en:'Blog',de:'Blog'},blogSub:{en:'Updates, tutorials, and deep dives.',de:'Updates, Tutorials und Deep Dives.'},back:{en:'All posts',de:'Alle Beiträge'},loading:{en:'Loading…',de:'Lade…'},loadErr:{en:'Failed to load post.',de:'Beitrag konnte nicht geladen werden.'}};

// ---- Init ----
var postData=[];
fetch('blog/index.json').then(function(r){return r.json()}).then(function(d){postData=d;renderPostList()}).catch(function(){document.getElementById('post-list').innerHTML='<p style="color:var(--red)">Could not load blog index.</p>'});

(function(){
  var s=localStorage.getItem('pipe-lang');if(!s){s=navigator.language.startsWith('de')?'de':'en'}currentLang=s;
  document.getElementById('btn-en').classList.toggle('active',s==='en');
  document.getElementById('btn-de').classList.toggle('active',s==='de');
  document.querySelectorAll('[data-lang="'+s+'"]').forEach(function(e){e.classList.add('active')});
  document.documentElement.lang=s;
  var ps=new URLSearchParams(window.location.search).get('post');
  if(ps) fetch('blog/index.json').then(function(r){return r.json()}).then(function(d){postData=d;showPost(ps)});
})();
</script>

</body>
</html>
