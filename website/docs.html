*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.6; }

nav { position: fixed; top: 0; z-index: 100; width: 100%; background: rgba(7,7,12,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 0; }

nav .logo span { color: var(--fg); }
nav .nav-links { display: flex; align-items: center; gap: 14px; }
nav a { color: var(--fg2); text-decoration: none; font-size: 0.8rem; transition: color .2s; white-space: nowrap; }
nav a:hover { color: var(--fg); }
.hamburger { display: none; background: none; border: none; color: var(--fg); font-size: 1.4rem; cursor: pointer; padding: 4px 8px; }

.lang-switch { display: flex; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
.lang-switch button { background: none; border: none; color: var(--fg2); padding: 4px 10px; font-size: 0.72rem; cursor: pointer; font-family: var(--sans); font-weight: 600; transition: all .2s; }
.lang-switch button.active { background: var(--accent); color: #fff; }

.docs-layout { display: flex; min-height: 100vh; padding-top: 56px; }
.sidebar { width: 260px; min-width: 260px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; position: sticky; top: 56px; height: calc(100vh - 56px); padding: 16px 12px; }
.sidebar::-webkit-scrollbar { width: 4px; }

.sidebar-search { margin-bottom: 16px; }
.sidebar-search input { width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--fg); font-size: 0.8rem; outline: none; font-family: var(--sans); }
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search input::placeholder { color: var(--fg3); }

.sidebar-group { margin-bottom: 14px; }
.sidebar-group-title { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
.sidebar-group-title .arrow { transition: transform .2s; font-size: 0.55rem; }
.sidebar-group-title.collapsed .arrow { transform: rotate(-90deg); }
.sidebar-group-chapters { display: flex; flex-direction: column; gap: 1px; }
.sidebar-group.collapsed .sidebar-group-chapters { display: none; }

.sidebar-chapter { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; text-decoration: none; color: var(--fg2); font-size: 0.78rem; transition: all .15s; border-left: 2px solid transparent; cursor: pointer; }
.sidebar-chapter:hover { background: var(--bg3); color: var(--fg); }

.sidebar-chapter .ch-num { font-family: var(--mono); font-size: 0.65rem; color: var(--accent); width: 28px; flex-shrink: 0; }

.content { flex: 1; max-width: 860px; padding: 32px 48px; overflow-wrap: break-word; }

.doc-body ul, .doc-body ol { margin-bottom: 12px; padding-left: 22px; }
.doc-body li { font-size: 0.9rem; margin-bottom: 4px; }
.doc-body a { color: var(--accent); text-decoration: none; }
.doc-body a:hover { text-decoration: underline; }
.doc-body strong { font-weight: 700; color: var(--orange); }
.doc-body code { background: var(--bg3); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 0.83em; color: var(--accent2); }
.doc-body pre { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; overflow-x: auto; margin-bottom: 14px; line-height: 1.55; }
.doc-body pre code { background: none; padding: 0; font-size: 0.82rem; color: var(--fg); }
.doc-body table { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: 0.85rem; }
.doc-body th { background: var(--bg2); border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-weight: 600; }
.doc-body td { border: 1px solid var(--border); padding: 8px 12px; }
.doc-body blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin-bottom: 12px; background: var(--bg2); border-radius: 0 var(--radius) var(--radius) 0; color: var(--fg2); font-size: 0.88rem; }
.doc-body hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

.doc-body .breadcrumb { font-size: 0.75rem; color: var(--fg3); margin-bottom: 20px; }
.doc-body .breadcrumb span { color: var(--fg2); }

/* Mobile */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
.sidebar-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 95; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 16px rgba(124,92,252,0.4); }

@media (max-width: 900px) {
  .sidebar { position: fixed; top: 56px; left: -280px; z-index: 95; height: calc(100vh - 56px); transition: left .25s; }

  nav .nav-links.open { display: flex; }
  .hamburger { display: block; }

@media (max-width: 480px) {
  .doc-body h1 { font-size: 1.5rem; }
  .doc-body h2 { font-size: 1.2rem; }
}

  {num:"AI",group:"ai",en:"AI_Roadmap.md",de:"AI_Roadmap.md",ten:"AI Roadmap",tde:"KI-Roadmap",den:"Detailed AI integration roadmap.",dde:"Detaillierte KI-Integrations-Roadmap."},

  {num:"23",group:"modules",en:"23-x-module.md",de:"23-x-modul.md",ten:"X Module",tde:"X-Modul",den:"Post to X/Twitter via the Pipe X module.",dde:"Auf X/Twitter posten mit dem Pipe X-Modul."},
  {num:"24",group:"modules",en:"24-discord-module.md",de:"24-discord-modul.md",ten:"Discord Module",tde:"Discord-Modul",den:"Discord bot integration.",dde:"Discord-Bot-Integration."},
  {num:"25",group:"modules",en:"25-mcp.md",de:"25-mcp.md",ten:"MCP Integration",tde:"MCP-Integration",den:"Model Context Protocol client and server.",dde:"Model Context Protocol Client und Server."},
  {num:"26",group:"modules",en:"26-sqlite-module.md",de:"26-sqlite-modul.md",ten:"SQLite Module",tde:"SQLite-Modul",den:"Embedded SQLite database integration.",dde:"Eingebettete SQLite-Datenbank-Integration."},

];

var GROUPS = [
  {id:"guide", en:"Language Guide", de:"Sprachführer"},
  {id:"reference", en:"Reference", de:"Referenz"},
  {id:"tooling", en:"Tooling & Internals", de:"Tooling & Interna"},
  {id:"practical", en:"Practical", de:"Praktisch"},
  {id:"ai", en:"AI", de:"KI"},
  {id:"sandbox", en:"Sandbox & Security", de:"Sandbox & Sicherheit"},
  {id:"modules", en:"Modules & Integration", de:"Module & Integration"}
];

var currentLang = 'en';
var activeChapter = null;
var allGroupsCollapsed = window.innerWidth < 900;

// i18n utilities
var L = {
  searchPlaceholder: {en:"Search docs…", de:"Doku durchsuchen…"},
  noResults: {en:"No chapters match.", de:"Keine Kapitel gefunden."},
  selectChapter: {en:"Select a chapter to start reading.", de:"Wähle ein Kapitel zum Lesen."},
  docsTitle: {en:"Pipe Documentation", de:"Pipe-Dokumentation"},
  docsSubtitle: {en:"41 chapters — from your first program to the bytecode VM. Available in English and German.", de:"41 Kapitel — vom ersten Programm bis zur Bytecode-VM. Englisch und Deutsch."},
  loading: {en:"Loading…", de:"Lade…"},
  loadError: {en:"Failed to load document.", de:"Dokument konnte nicht geladen werden."},
  prev: {en:"« Previous", de:"« Zurück"},
  next: {en:"Next »", de:"Weiter »"}
};

// ---- Sidebar ----

function buildChapterTree() {
  var lang = currentLang;
  var tree = document.getElementById('chapter-tree');
  var html = '';
  for (var gi = 0; gi < GROUPS.length; gi++) {
    var g = GROUPS[gi];
    var chs = CHAPTERS.filter(function(c){return c.group===g.id;});
    html += '<div class="sidebar-group" id="sg-'+g.id+'">';
    html += '  <div class="sidebar-group-title'+(allGroupsCollapsed?' collapsed':'')+'" onclick="toggleGroup(\''+g.id+'\')"><span class="arrow">▼</span><span data-lang="en">'+g.en+'</span><span data-lang="de">'+g.de+'</span></div>';
    html += '  <div class="sidebar-group-chapters">';
    for (var ci = 0; ci < chs.length; ci++) {
      var c = chs[ci];
      var file = lang==='de' ? c.de : c.en;
      var title = lang==='de' ? c.tde : c.ten;
      var desc = lang==='de' ? c.dde : c.den;
      html += '    <a class="sidebar-chapter" data-chapter="'+c.en.replace('.md','')+'" data-file="'+file+'" data-group="'+c.group+'" data-num="'+c.num+'" onclick="loadChapter(this,\''+file+'\',\''+c.num+'\',\''+escapeAttr(title)+'\')" title="'+escapeAttr(desc)+'">';
      html += '      <span class="ch-num">'+c.num+'</span>';
      html += '      <span class="ch-title">'+title+'</span>';
      html += '    </a>';
    }
    html += '  </div>';
    html += '</div>';
  }
  tree.innerHTML = html;
}

function updateChapterLabels() {
  var lang = currentLang;
  var chs = document.querySelectorAll('.sidebar-chapter');
  for (var i = 0; i < chs.length; i++) {
    var a = chs[i];
    var num = a.getAttribute('data-num');
    var enFile = a.getAttribute('data-chapter') + '.md';
    for (var j = 0; j < CHAPTERS.length; j++) {
      if (CHAPTERS[j].en === enFile) {
        var file = lang==='de' ? CHAPTERS[j].de : CHAPTERS[j].en;
        var title = lang==='de' ? CHAPTERS[j].tde : CHAPTERS[j].ten;
        a.setAttribute('data-file', file);
        a.querySelector('.ch-title').textContent = title;
        break;
      }
    }
  }
}

function toggleGroup(id) {
  var sg = document.getElementById('sg-'+id);
  var title = sg.querySelector('.sidebar-group-title');
  title.classList.toggle('collapsed');
}

function filterChapters() {
  var q = document.getElementById('search').value.toLowerCase();
  var groups = document.querySelectorAll('.sidebar-group');
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    var chs = g.querySelectorAll('.sidebar-chapter');
    var hasVisible = false;
    for (var j = 0; j < chs.length; j++) {
      var c = chs[j];
      var title = c.querySelector('.ch-title').textContent.toLowerCase();
      var num = c.getAttribute('data-num').toLowerCase();
      var visible = !q || title.indexOf(q) >= 0 || num.indexOf(q) >= 0;
      c.style.display = visible ? '' : 'none';
      if (visible) hasVisible = true;
    }
    g.style.display = hasVisible ? '' : 'none';
  }
}

// ---- Content ----

function loadChapter(linkEl, file, num, title) {
  document.querySelectorAll('.sidebar-chapter').forEach(function(a){a.classList.remove('active');});
  if (linkEl) linkEl.classList.add('active');
  activeChapter = linkEl;

  if (window.innerWidth < 900) closeSidebar();

  var content = document.getElementById('doc-content');
  content.className = 'content loading';
  content.innerHTML = '<div style="text-align:center;color:var(--fg2);padding-top:120px">'+L.loading[currentLang]+'</div>';

  var lang = currentLang;
  var url = 'docs/'+lang+'/'+file;

  fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(md){
    var html = renderMarkdown(md);
    var ci = getChapterIndexByFile(file);
    var prev = getAdjacentChapter(ci, -1);
    var next = getAdjacentChapter(ci, 1);

    var nav = '';
    var t = lang==='de' ? prev? prev.tde : '' : prev? prev.ten : '';
    var tn = lang==='de' ? next? next.tde : '' : next? next.ten : '';
    if (prev || next) {
      nav = '<div style="display:flex;justify-content:space-between;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)">';
      if (prev) nav += '<a href="javascript:void(0)" onclick="navChapter(\''+prev.en.replace('.md','')+'\')" style="color:var(--accent);text-decoration:none;font-size:0.85rem">'+L.prev[currentLang]+'<br><span style="font-size:0.75rem;color:var(--fg2)">'+t+'</span></a>';
      else nav += '<span></span>';
      if (next) nav += '<a href="javascript:void(0)" onclick="navChapter(\''+next.en.replace('.md','')+'\')" style="color:var(--accent);text-decoration:none;font-size:0.85rem;text-align:right">'+L.next[currentLang]+'<br><span style="font-size:0.75rem;color:var(--fg2)">'+tn+'</span></a>';
      else nav += '<span></span>';
      nav += '</div>';
    }

    content.className = 'content';
    content.innerHTML = '<div class="doc-body"><div class="breadcrumb"><span>Pipe</span> / <span>Docs</span> / <span>'+title+'</span></div><div class="markdown-body">'+html+'</div>'+nav+'</div>';

    history.replaceState(null, '', '?chapter='+file.replace('.md','')+'&lang='+lang);
  }).catch(function(e){
    content.className = 'content';
    content.innerHTML = '<div class="content-placeholder"><p style="color:var(--red)">'+L.loadError[currentLang]+': '+e.message+'</p></div>';
  });
}

function navChapter(enBase) {
  for (var j = 0; j < CHAPTERS.length; j++) {
    if (CHAPTERS[j].en.replace('.md','') === enBase) {
      var file = currentLang==='de' ? CHAPTERS[j].de : CHAPTERS[j].en;
      var title = currentLang==='de' ? CHAPTERS[j].tde : CHAPTERS[j].ten;
      var link = document.querySelector('.sidebar-chapter[data-chapter="'+enBase+'"]');
      loadChapter(link, file, CHAPTERS[j].num, title);
      break;
    }
  }
}

function getChapterIndexByFile(file) {
  for (var i = 0; i < CHAPTERS.length; i++) {
    var f = currentLang==='de' ? CHAPTERS[i].de : CHAPTERS[i].en;
    if (f === file) return i;
  }
  return -1;
}

function getAdjacentChapter(index, offset) {
  if (index < 0) return null;
  var ni = index + offset;
  if (ni < 0 || ni >= CHAPTERS.length) return null;
  return CHAPTERS[ni];
}

// ---- Markdown ----

var mdRenderer = {
  heading: function(text, level) {
    if (level === 1) {
      var tn = getTitleNumber(text);
      return '<h1 id="'+slugify(text)+'">'+(tn?'<span style="font-family:var(--mono);font-size:0.7em;color:var(--accent);margin-right:8px">'+tn+'</span>':'')+text+'</h1>\n';
    }
    return '<h'+level+' id="'+slugify(text)+'">'+text+'</h'+level+'>\n';
  },
  code: function(code, lang, escaped) { return '<pre><code>'+code+'</code></pre>\n'; },
  codespan: function(code) { return '<code>'+code+'</code>'; },
  link: function(href, title, text) { return '<a href="'+href+'"'+(title?' title="'+title+'"':'')+'>'+text+'</a>'; },
  paragraph: function(text) { return '<p>'+text+'</p>\n'; },
  strong: function(text) { return '<strong>'+text+'</strong>'; },
  em: function(text) { return '<em>'+text+'</em>'; },
  del: function(text) { return '<del>'+text+'</del>'; },
  list: function(body, ordered, start) { var t = ordered ? 'ol' : 't'; return '<'+t+(start&&start!==1?' start="'+start+'"':'')+'>\n'+body+'</'+t+'>\n'; },
  listitem: function(text, task, checked) { return '<li>'+text+'</li>\n'; },
  table: function(header, body) { return '<table>\n<thead>\n'+header+'</thead>\n<tbody>\n'+body+'</tbody>\n</table>\n'; },
  tablerow: function(content, flags) { return '<tr>\n'+content+'</tr>\n'; },
  tablecell: function(content, flags) { var t = flags.header ? 'th' : 'td'; return '<'+t+(flags.align?' style="text-align:'+flags.align+'"':'')+'>'+content+'</'+t+'>\n'; },
  blockquote: function(quote) { return '<blockquote>\n'+quote+'</blockquote>\n'; },
  hr: function() { return '<hr>\n'; },
  image: function(href, title, text) { return '<img src="'+href+'" alt="'+text+'"'+(title?' title="'+title+'"':'')+' style="max-width:100%">'; }
};

function renderMarkdown(md) {
  var text = md.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var lines = text.split('\n');
  var output = [];
  var i = 0;

  while (i < lines.length) {
    var line = lines[i];

    // code blocks
    if (line.match(/^```/)) {
      var lang = line.slice(3).trim();
      i++;
      var codeLines = [];
      while (i < lines.length && !lines[i].match(/^```/)) {
        codeLines.push(lines[i]);
        i++;
      }
      i++; // skip closing ```
      output.push(mdRenderer.code(codeLines.join('\n'), lang));
      continue;
    }

    // headings
    var mh = line.match(/^(#{1,6})\s+(.+)/);
    if (mh) {
      output.push(mdRenderer.heading(mh[2], mh[1].length));
      i++;
      continue;
    }

    // hr
    if (line.match(/^---/)) {
      output.push(mdRenderer.hr());
      i++;
      continue;
    }

    // blockquote
    if (line.match(/^> /)) {
      var qlines = [];
      while (i < lines.length && lines[i].match(/^> /)) {
        qlines.push(lines[i].slice(2));
        i++;
      }
      output.push(mdRenderer.blockquote(inlineParse(qlines.join('\n'))));
      continue;
    }

    // tables
    if (line.indexOf('|') >= 0 && i+1 < lines.length && lines[i+1].match(/^\|[\s\-:|]+\|$/)) {
      var headerRow = line;
      i++; // skip separator
      i++;
      var bodyRows = [];
      while (i < lines.length && lines[i].trim().indexOf('|') >= 0) {
        bodyRows.push(lines[i]);
        i++;
      }

      var hcells = headerRow.split('|').filter(function(c){return c.trim();});
      var ahdr = '';
      for (var hi = 0; hi < hcells.length; hi++) {
        ahdr += mdRenderer.tablecell(inlineParse(hcells[hi].trim()), {header:true});
      }
      var hrow = mdRenderer.tablerow(ahdr);

      var brows = '';
      for (var ri = 0; ri < bodyRows.length; ri++) {
        var bcells = bodyRows[ri].split('|').filter(function(c){return c.trim();});
        var bdr = '';
        for (var bi = 0; bi < bcells.length; bi++) {
          bdr += mdRenderer.tablecell(inlineParse(bcells[bi].trim()), {});
        }
        brows += mdRenderer.tablerow(bdr);
      }
      output.push(mdRenderer.table(hrow, brows));
      continue;
    }

    // unordered lists
    if (line.match(/^[\-\*\+]\s+/)) {
      var litems = [];
      while (i < lines.length && lines[i].match(/^[\-\*\+]\s+/)) {
        litems.push(lines[i].replace(/^[\-\*\+]\s+/, ''));
        i++;
      }
      var lbody = '';
      for (var li = 0; li < litems.length; li++) {
        lbody += mdRenderer.listitem(inlineParse(litems[li]));
      }
      output.push(mdRenderer.list(lbody, false));
      continue;
    }

    // ordered lists
    if (line.match(/^\d+\.\s+/)) {
      var olitems = [];
      while (i < lines.length && lines[i].match(/^\d+\.\s+/)) {
        olitems.push(lines[i].replace(/^\d+\.\s+/, ''));
        i++;
      }
      var olbody = '';
      for (var oi = 0; oi < olitems.length; oi++) {
        olbody += mdRenderer.listitem(inlineParse(olitems[oi]));
      }
      output.push(mdRenderer.list(olbody, true));
      continue;
    }

    // empty line
    if (line.trim() === '') { i++; continue; }

    // paragraph
    var plines = [];
    while (i < lines.length && lines[i].trim() !== '' && !lines[i].match(/^(#{1,6}\s|^> |^```|^[\-\*\+]\s|^\d+\.\s|^---|^\|)/)) {
      plines.push(lines[i]);
      i++;
    }
    if (plines.length) {
      output.push(mdRenderer.paragraph(inlineParse(plines.join(' '))));
    }
  }
  return output.join('\n');
}

function inlineParse(text) {
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  return text;
}

function slugify(text) {
  return text.toLowerCase().replace(/[^\w-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function getTitleNumber(text) {
  var m = text.match(/^(\d+)\.\s/);
  return m ? m[1] : null;
}

function escapeAttr(s) { return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ---- Sidebar toggle ----

function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebar-overlay');
  var open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('open', open);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ---- Lang ----

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('[data-lang]').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('[data-lang="'+lang+'"]').forEach(function(el){el.classList.add('active');});
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-de').classList.toggle('active', lang==='de');
  document.documentElement.lang = lang;
  document.getElementById('search').placeholder = L.searchPlaceholder[lang];
  localStorage.setItem('pipe-lang', lang);

  updateChapterLabels();
  var placeholder = document.querySelector('.content-placeholder');
  if (placeholder) {
    placeholder.querySelector('h2').textContent = L.docsTitle[lang];
    placeholder.querySelector('p').textContent = L.docsSubtitle[lang];
  }
  if (activeChapter) {
    var file = currentLang==='de' ? getChapterDE(activeChapter.getAttribute('data-chapter')) : activeChapter.getAttribute('data-chapter')+'.md';
    var ci = getChapterIndexByFile(file);
    if (ci >= 0) {
      var title = currentLang==='de' ? CHAPTERS[ci].tde : CHAPTERS[ci].ten;
      loadChapter(activeChapter, file, CHAPTERS[ci].num, title);
    }
  }
}

function getChapterDE(enBase) {
  for (var j = 0; j < CHAPTERS.length; j++) {
    if (CHAPTERS[j].en.replace('.md','') === enBase) return CHAPTERS[j].de;
  }
  return enBase+'.md';
}

// ---- Init ----

(function() {
  var stored = localStorage.getItem('pipe-lang');
  if (!stored) stored = navigator.language.startsWith('de') ? 'de' : 'en';
  currentLang = stored;
  document.getElementById('search').placeholder = L.searchPlaceholder[stored];

  buildChapterTree();
  setLang(stored);

  // URL deep-link
  var params = new URLSearchParams(window.location.search);
  var ch = params.get('chapter');
  if (ch) {
    var file = stored==='de' ? getChapterDE(ch) : ch+'.md';
    var ci = getChapterIndexByFile(file);
    if (ci >= 0) {
      var title = stored==='de' ? CHAPTERS[ci].tde : CHAPTERS[ci].ten;
      var link = document.querySelector('.sidebar-chapter[data-chapter="'+ch+'"]');
      loadChapter(link, file, CHAPTERS[ci].num, title);
    }
  }
})();
</script>
