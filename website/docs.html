function buildChapterTree() {

  for (var gi = 0; gi < GROUPS.length; gi++) {
    var g = GROUPS[gi];

    html += '<div class="sidebar-group" id="sg-'+g.id+'">';
    html += '  <div class="sidebar-group-title'+(allGroupsCollapsed?' collapsed':'')+'" onclick="toggleGroup(\''+g.id+'\')"><span class="arrow">▼</span><span data-lang="en">'+g.en+'</span><span data-lang="de">'+g.de+'</span></div>';
    html += '  <div class="sidebar-group-chapters">';

      html += '      <span class="ch-num">'+c.num+'</span>';

function filterChapters() {

function loadChapter(linkEl, file, num, title) {
  document.querySelectorAll('.sidebar-chapter').forEach(function(a){a.classList.remove('active');});
  if (linkEl) linkEl.classList.add('active');
  activeChapter = linkEl;

  if (window.innerWidth < 900) closeSidebar();

  var content = document.getElementById('doc-content');
  content.className = 'content loading';
  content.innerHTML = '<div style="text-align:center;color:var(--fg2);padding-top:120px">'+L.loading[currentLang]+'</div>';
  clearToc();

  var lang = currentLang;
  var url = 'docs/'+lang+'/'+file;
  var cacheKey = 'pipe-doc|'+lang+'|'+file;

  var cached = null;
  try { cached = sessionStorage.getItem(cacheKey); } catch(e) {}
  if (cached) {
    renderChapter(content, cached, file, lang, title, url);
    return;
  }

  fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(md){
    try { sessionStorage.setItem(cacheKey, md); } catch(e) {}
    renderChapter(content, md, file, lang, title, url);
  }).catch(function(e){
    content.className = 'content';
    content.innerHTML = '<div class="content-placeholder"><p style="color:var(--red)">'+L.loadError[currentLang]+': '+e.message+'</p></div>';
    clearToc();
  });
}

function renderChapter(content, md, file, lang, title, url) {
  var html = renderMarkdown(md);
  var ci = getChapterIndexByFile(file);
  var prev = getAdjacentChapter(ci, -1);
  var next = getAdjacentChapter(ci, 1);

  var nav = '';
  var t = lang==='de' ? prev? prev.tde : '' : prev? prev.ten : '';
  var tn = lang==='de' ? next? next.tde : '' : next? next.ten : '';
  if (prev || next) {
    nav = '<div class="chapter-nav" style="display:flex;justify-content:space-between;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)">';
    if (prev) nav += '<a href="javascript:void(0)" onclick="navChapter(\''+prev.en.replace('.md','')+'\')" style="color:var(--accent);text-decoration:none;font-size:0.85rem">'+L.prev[currentLang]+'<br><span style="font-size:0.75rem;color:var(--fg2)">'+t+'</span></a>';
    else nav += '<span></span>';
    if (next) nav += '<a href="javascript:void(0)" onclick="navChapter(\''+next.en.replace('.md','')+'\')" style="color:var(--accent);text-decoration:none;font-size:0.85rem;text-align:right">'+L.next[currentLang]+'<br><span style="font-size:0.75rem;color:var(--fg2)">'+tn+'</span></a>';
    else nav += '<span></span>';
    nav += '</div>';
  }

  content.className = 'content fade';
  content.innerHTML = '<div class="doc-body">'
    + '<div class="inpage-search"><input type="text" id="inpage-search" placeholder="'+L.inpageSearch[lang]+'" oninput="inpageSearch()" aria-label="'+L.inpageSearch[lang]+'"><span id="inpage-count"></span></div>'
    + '<div class="breadcrumb"><span>Pipe</span> / <span>Docs</span> / <span>'+title+'</span></div>'
    + '<div class="markdown-body">'+html+'</div>'+nav+'</div>';

  setChapterSeo(title, lang, file);
  buildToc();
  window.scrollTo(0, 0);
  history.replaceState(null, '', '?chapter='+file.replace('.md','')+'&lang='+lang);
}

function navChapter(enBase) {
  for (var j = 0; j < CHAPTERS.length; j++) {
    if (CHAPTERS[j].en.replace('.md','') === enBase) {
      var file = currentLang==='de' ? CHAPTERS[j].de : CHAPTERS[j].en;
      var title = currentLang==='de' ? CHAPTERS[j].tde : CHAPTERS[j].ten;
      var link = document.querySelector('.sidebar-chapter[data-chapter="'+enBase+'"]');
      loadChapter(link, file, CHAPTERS[j].num, title);
      break;
    }
  }
}

function navChapterByOffset(offset) {
  if (!activeChapter) return;
  var enBase = activeChapter.getAttribute('data-chapter');
  for (var j = 0; j < CHAPTERS.length; j++) {
    if (CHAPTERS[j].en.replace('.md','') === enBase) {
      var ni = j + offset;
      if (ni < 0 || ni >= CHAPTERS.length) return;
      var c = CHAPTERS[ni];
      var file = currentLang==='de' ? c.de : c.en;
      var title = currentLang==='de' ? c.tde : c.ten;
      var link = document.querySelector('.sidebar-chapter[data-chapter="'+c.en.replace('.md','')+'"]');
      loadChapter(link, file, c.num, title);
      return;
    }
  }
}

function copyCode(btn) {
  var pre = btn.parentNode.nextElementSibling;
  var text = pre ? pre.textContent : '';
  if (!navigator.clipboard || !text) return;
  navigator.clipboard.writeText(text).then(function(){
    btn.textContent = L.copied[currentLang];
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = L.copy[currentLang]; btn.classList.remove('copied'); }, 1500);
  });
}

function setChapterSeo(title, lang, file) {
  var chapter = null;
  for (var j = 0; j < CHAPTERS.length; j++) {
    if ((lang==='de' ? CHAPTERS[j].de : CHAPTERS[j].en) === file) { chapter = CHAPTERS[j]; break; }
  }
  document.title = title+' — Docs — Pipe (SPR)';
  var meta = document.querySelector('meta[name="description"]');
  if (meta && chapter) meta.setAttribute('content', (lang==='de'?chapter.dde:chapter.den)+' Pipe (SPR) documentation.');
  var og = document.querySelector('meta[property="og:description"]');
  if (og && chapter) og.setAttribute('content', lang==='de'?chapter.dde:chapter.den);
}

function clearToc() {
  var list = document.getElementById('toc-list');
  if (list) list.innerHTML = '';
}

function buildToc() {
  var list = document.getElementById('toc-list');
  var body = document.querySelector('.doc-body');
  if (!list || !body) return;
  var headings = body.querySelectorAll('h2, h3');
  var html = '';
  for (var i = 0; i < headings.length; i++) {
    var h = headings[i];
    if (!h.id) h.id = slugify(h.textContent);
    html += '<a class="'+(h.tagName==='H3'?'toc-h3':'')+'" href="#'+h.id+'" data-target="'+h.id+'">'+h.textContent+'</a>';
  }
  list.innerHTML = html;
  var links = list.querySelectorAll('a');
  if (links.length && 'IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) {
          for (var i = 0; i < links.length; i++) links[i].classList.remove('active');
          var link = list.querySelector('a[data-target="'+e.target.id+'"]');
          if (link) link.classList.add('active');
        }
      });
    }, { rootMargin: '-70px 0px -72% 0px', threshold: 0 });
    for (var j = 0; j < headings.length; j++) observer.observe(headings[j]);
  }
}

function inpageSearch() {
  var input = document.getElementById('inpage-search');
  var body = document.querySelector('.markdown-body');
  var countEl = document.getElementById('inpage-count');
  if (countEl) countEl.textContent = '';
  if (!input || !body) return;
  var q = input.value.trim();
  clearMarks(body);
  if (!q) return;
  var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')+')', 'ig');
  var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      var p = node.parentNode;
      if (p && p.closest && p.closest('mark, script, style, button, .inpage-search')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  var count = 0;
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var text = node.nodeValue;
    re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    var frag = document.createDocumentFragment();
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var mark = document.createElement('mark');
      mark.textContent = m[0];
      frag.appendChild(mark);
      count++;
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  if (countEl && count > 0) countEl.textContent = count+'×';
}

function clearMarks(body) {
  var marks = body.querySelectorAll('mark');
  for (var i = marks.length - 1; i >= 0; i--) {
    var m = marks[i];
    var p = m.parentNode;
    if (!p) continue;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
  }
}

function getChapterIndexByFile(file) {
  for (var i = 0; i < CHAPTERS.length; i++) {
    var f = currentLang==='de' ? CHAPTERS[i].de : CHAPTERS[i].en;
    if (f === file) return i;
  }
  return -1;
}

function getAdjacentChapter(index, offset) {
  if (index < 0) return null;
  var ni = index + offset;
  if (ni < 0 || ni >= CHAPTERS.length) return null;
  return CHAPTERS[ni];
}

// ---- Markdown ----

var mdRenderer = {
  heading: function(text, level) {
    if (level === 1) {
      var tn = getTitleNumber(text);
      return '<h1 id="'+slugify(text)+'">'+(tn?'<span style="font-family:var(--mono);font-size:0.7em;color:var(--accent);margin-right:8px">'+tn+'</span>':'')+text+'</h1>\n';
    }
    return '<h'+level+' id="'+slugify(text)+'">'+text+'</h'+level+'>\n';
  },
  code: function(code, lang) {
    return '<div class="code-block-wrap"><div class="code-head"><span class="code-lang">'+(lang||'code')+'</span><button class="copy-btn" type="button" onclick="copyCode(this)">'+L.copy[currentLang]+'</button></div><pre class="code-block"><code>'+code+'</code></pre></div>\n';
  },
  codespan: function(code) { return '<code>'+code+'</code>'; },
  link: function(href, title, text) { return '<a href="'+href+'"'+(title?' title="'+title+'"':'')+'>'+text+'</a>'; },
  paragraph: function(text) { return '<p>'+text+'</p>\n'; },
  strong: function(text) { return '<strong>'+text+'</strong>'; },
  em: function(text) { return '<em>'+text+'</em>'; },
  del: function(text) { return '<del>'+text+'</del>'; },
  list: function(body, ordered, start) { var t = ordered ? 'ol' : 't'; return '<'+t+(start&&start!==1?' start="'+start+'"':'')+'>\n'+body+'</'+t+'>\n'; },
  listitem: function(text, task, checked) { return '<li>'+text+'</li>\n'; },
  table: function(header, body) { return '<div class="table-wrap"><table>\n<thead>\n'+header+'</thead>\n<tbody>\n'+body+'</tbody>\n</table></div>\n'; },
  tablerow: function(content, flags) { return '<tr>\n'+content+'</tr>\n'; },
  tablecell: function(content, flags) { var t = flags.header ? 'th' : 'td'; return '<'+t+(flags.align?' style="text-align:'+flags.align+'"':'')+'>'+content+'</'+t+'>\n'; },
  blockquote: function(quote) { return '<blockquote>\n'+quote+'</blockquote>\n'; },
  hr: function() { return '<hr>\n'; },
  image: function(href, title, text) { return '<img src="'+href+'" alt="'+text+'"'+(title?' title="'+title+'"':'')+' style="max-width:100%">'; }
};

function renderMarkdown(md) {
  var text = md.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var lines = text.split('\n');
  var output = [];
  var i = 0;

  while (i < lines.length) {
    var line = lines[i];

    // code blocks
    if (line.match(/^```/)) {
      var lang = line.slice(3).trim();
      i++;
      var codeLines = [];
      while (i < lines.length && !lines[i].match(/^```/)) {
        codeLines.push(lines[i]);
        i++;
      }
      i++; // skip closing ```
      output.push(mdRenderer.code(codeLines.join('\n'), lang));
      continue;
    }

    // headings
    var mh = line.match(/^(#{1,6})\s+(.+)/);
    if (mh) {
      output.push(mdRenderer.heading(mh[2], mh[1].length));
      i++;
      continue;
    }

    // hr
    if (line.match(/^---/)) {
      output.push(mdRenderer.hr());
      i++;
      continue;
    }

    // blockquote
    if (line.match(/^> /)) {
      var qlines = [];
      while (i < lines.length && lines[i].match(/^> /)) {
        qlines.push(lines[i].slice(2));
        i++;
      }
      output.push(mdRenderer.blockquote(inlineParse(qlines.join('\n'))));
      continue;
    }

    // tables
    if (line.indexOf('|') >= 0 && i+1 < lines.length && lines[i+1].match(/^\|[\s\-:|]+\|$/)) {
      var headerRow = line;
      i++; // skip separator
      i++;
      var bodyRows = [];
      while (i < lines.length && lines[i].trim().indexOf('|') >= 0) {
        bodyRows.push(lines[i]);
        i++;
      }

      var hcells = headerRow.split('|').filter(function(c){return c.trim();});
      var ahdr = '';
      for (var hi = 0; hi < hcells.length; hi++) {
        ahdr += mdRenderer.tablecell(inlineParse(hcells[hi].trim()), {header:true});
      }
      var hrow = mdRenderer.tablerow(ahdr);

      var brows = '';
      for (var ri = 0; ri < bodyRows.length; ri++) {
        var bcells = bodyRows[ri].split('|').filter(function(c){return c.trim();});
        var bdr = '';
        for (var bi = 0; bi < bcells.length; bi++) {
          bdr += mdRenderer.tablecell(inlineParse(bcells[bi].trim()), {});
        }
        brows += mdRenderer.tablerow(bdr);
      }
      output.push(mdRenderer.table(hrow, brows));
      continue;
    }

    // unordered lists
    if (line.match(/^[\-\*\+]\s+/)) {
      var litems = [];
      while (i < lines.length && lines[i].match(/^[\-\*\+]\s+/)) {
        litems.push(lines[i].replace(/^[\-\*\+]\s+/, ''));
        i++;
      }
      var lbody = '';
      for (var li = 0; li < litems.length; li++) {
        lbody += mdRenderer.listitem(inlineParse(litems[li]));
      }
      output.push(mdRenderer.list(lbody, false));
      continue;
    }

    // ordered lists
    if (line.match(/^\d+\.\s+/)) {
      var olitems = [];
      while (i < lines.length && lines[i].match(/^\d+\.\s+/)) {
        olitems.push(lines[i].replace(/^\d+\.\s+/, ''));
        i++;
      }
      var olbody = '';
      for (var oi = 0; oi < olitems.length; oi++) {
        olbody += mdRenderer.listitem(inlineParse(olitems[oi]));
      }
      output.push(mdRenderer.list(olbody, true));
      continue;
    }

    // empty line
    if (line.trim() === '') { i++; continue; }

    // paragraph
    var plines = [];
    while (i < lines.length && lines[i].trim() !== '' && !lines[i].match(/^(#{1,6}\s|^> |^```|^[\-\*\+]\s|^\d+\.\s|^---|^\|)/)) {
      plines.push(lines[i]);
      i++;
    }
    if (plines.length) {
      output.push(mdRenderer.paragraph(inlineParse(plines.join(' '))));
    }
  }
  return output.join('\n');
}

function inlineParse(text) {
  text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  return text;
}

function slugify(text) {
  return text.toLowerCase().replace(/[^\w-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function getTitleNumber(text) {
  var m = text.match(/^(\d+)\.\s/);
  return m ? m[1] : null;
}

function escapeAttr(s) { return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('[data-lang]').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('[data-lang="'+lang+'"]').forEach(function(el){el.classList.add('active');});
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-de').classList.toggle('active', lang==='de');
  document.documentElement.lang = lang;
  document.getElementById('search').placeholder = L.searchPlaceholder[lang];
  var ips = document.getElementById('inpage-search');
  if (ips) ips.placeholder = L.inpageSearch[lang];
  localStorage.setItem('pipe-lang', lang);

  updateChapterLabels();
  var placeholder = document.querySelector('.content-placeholder');
  if (placeholder) {
    placeholder.querySelector('h2').textContent = L.docsTitle[lang];
    placeholder.querySelector('p').textContent = L.docsSubtitle[lang];
  }
  if (activeChapter) {
    var file = currentLang==='de' ? getChapterDE(activeChapter.getAttribute('data-chapter')) : activeChapter.getAttribute('data-chapter')+'.md';
    var ci = getChapterIndexByFile(file);
    if (ci >= 0) {
      var title = currentLang==='de' ? CHAPTERS[ci].tde : CHAPTERS[ci].ten;
      loadChapter(activeChapter, file, CHAPTERS[ci].num, title);
    }
  }
}

function getChapterDE(enBase) {
  for (var j = 0; j < CHAPTERS.length; j++) {
    if (CHAPTERS[j].en.replace('.md','') === enBase) return CHAPTERS[j].de;
  }
  return enBase+'.md';
}

// ---- Init ----

(function() {
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get('lang');
  var stored = localStorage.getItem('pipe-lang');
  if (!stored) stored = navigator.language.startsWith('de') ? 'de' : 'en';
  if (langParam === 'en' || langParam === 'de') stored = langParam;
  currentLang = stored;
  document.getElementById('search').placeholder = L.searchPlaceholder[stored];

  buildChapterTree();
  setLang(stored);

  // URL deep-link
  var ch = params.get('chapter');
  if (ch) {
    var file = stored==='de' ? getChapterDE(ch) : ch+'.md';
    var ci = getChapterIndexByFile(file);
    if (ci >= 0) {
      var title = stored==='de' ? CHAPTERS[ci].tde : CHAPTERS[ci].ten;
      var link = document.querySelector('.sidebar-chapter[data-chapter="'+ch+'"]');
      loadChapter(link, file, CHAPTERS[ci].num, title);
    }
  }

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowLeft') { navChapterByOffset(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { navChapterByOffset(1); e.preventDefault(); }
    else if (e.key === 'Escape') closeSidebar();
    else if (e.key === '/') { document.getElementById('search').focus(); e.preventDefault(); }
  });
})();
</script>
