<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe — Playground</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070c;color:#e8e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.4rem;margin:10px 0 4px;font-weight:800}
h1 span{background:linear-gradient(135deg,#a855f7,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#9090a8;font-size:.8rem;margin-bottom:16px}
.wrap{width:100%;max-width:720px}
.play-card{background:#0d0d16;border:1px solid #1e1e2e;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(168,85,247,0.04),0 16px 48px rgba(0,0,0,0.4)}
.play-top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#141420;border-bottom:1px solid #1e1e2e}
.play-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.play-run-btn{background:#a855f7;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-weight:600;font-size:.78rem;cursor:pointer}
.play-run-btn:hover:not(:disabled){background:#8e72fc}
.play-run-btn:disabled{opacity:0.4;cursor:not-allowed}
textarea{width:100%;min-height:140px;padding:14px 16px;font:14px/1.6 'JetBrains Mono','Fira Code',monospace;background:transparent;border:none;color:#e8e8f0;resize:vertical;outline:none;white-space:pre-wrap;tab-size:4}
.play-bar{padding:6px 14px;background:#141420;border-top:1px solid #1e1e2e;font-size:.68rem;color:#9090a8;font-family:'JetBrains Mono','Fira Code',monospace}
.play-output{padding:12px 16px;font:13px/1.6 'JetBrains Mono','Fira Code',monospace;color:#3ce096;min-height:40px;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.play-output.error{color:#fc5c7c}
a{color:#a855f7;text-decoration:none}
.ft{color:#606078;font-size:.7rem;text-align:center;margin:20px 0}
</style>
</head>
<body>
<h1>Pipe <span>Playground</span></h1>
<p class="sub">Write code. Run in browser.</p>

<div class="wrap">
  <div class="play-card">
    <div class="play-top">
      <div>
        <span class="play-dot" style="background:#fc5c7c"></span>
        <span class="play-dot" style="background:#fc8c3c"></span>
        <span class="play-dot" style="background:#3ce096"></span>
      </div>
      <button id="play-btn" class="play-run-btn" disabled onclick="runPlay()">▶ Run</button>
    </div>
    <textarea id="play-editor" placeholder="Write Pipe code..." spellcheck="false">print (2 + 2)</textarea>
    <div class="play-bar" id="play-bar"><span id="play-status">⏳ loading wasm…</span></div>
    <div class="play-output" id="play-out"></div>
  </div>
</div>

<p class="ft"><a href="index.html">home</a> · <a href="https://github.com/MachuraHarry/pipe">github</a></p>

<script src="wasm_exec.js"></script>
<script>
let pipeReady = false;
const pipeGo = new Go();

fetch("pipe.wasm").then(r => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return WebAssembly.instantiateStreaming(r, pipeGo.importObject);
}).then(r => {
  document.getElementById("play-status").textContent = "starting…";
  pipeGo.run(r.instance);
  pipeReady = true;
  document.getElementById("play-status").textContent = "✓ ready";
  document.getElementById("play-btn").disabled = false;
}).catch(e => {
  document.getElementById("play-status").textContent = "✗ " + e.message;
  console.error("WASM:", e);
});

function runPlay() {
  const btn=document.getElementById("play-btn"),out=document.getElementById("play-out"),bar=document.getElementById("play-bar");
  if(!pipeReady||btn.disabled)return;
  btn.disabled=true;btn.textContent="⏳";
  bar.innerHTML='<span style="color:#fc8c3c">running…</span>';
  out.className="play-output";
  out.textContent="";
  setTimeout(function(){
    try{
      const code=document.getElementById("play-editor").value;
      const result=pipeRun(code);
      btn.disabled=false;btn.textContent="▶ Run";
      if(result&&(result.includes("Error:")||result.includes("Parse error"))){
        bar.innerHTML='<span style="color:#fc5c7c">✗ error</span>';
        out.className="play-output error";
      }else{
        bar.innerHTML='<span style="color:#3ce096">✓ done</span>';
      }
      out.textContent=result||"(no output)";
    }catch(e){
      btn.disabled=false;btn.textContent="▶ Run";
      bar.innerHTML='<span style="color:#fc5c7c">✗ error</span>';
      out.className="play-output error";
      out.textContent="Error: "+e.message;
    }
  },50);
}

document.getElementById("play-editor").addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter")runPlay();
});
</script>
</body>
</html>
