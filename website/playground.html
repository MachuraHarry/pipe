<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe Playground — Try Pipe in your browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e8;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{background:linear-gradient(135deg,#7c5cfc,#5ce0fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2rem;text-align:center;margin:30px 0 5px}
.subtitle{color:#9898a8;text-align:center;margin-bottom:25px;font-size:0.9rem}
.loading{color:#fc8c3c;text-align:center;margin:40px;font-size:1.1rem}
.container{width:100%;max-width:850px;display:flex;flex-direction:column;gap:12px;padding:0 16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar select{background:#1a1a24;color:#e0e0e8;border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:0.82rem}
button{background:#7c5cfc;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#8e72fc}
button:disabled{opacity:0.4;cursor:not-allowed}
#editor{width:100%;height:220px;background:#111118;color:#5ce0fc;border:1px solid #22222e;border-radius:8px;padding:16px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:0.88rem;resize:vertical;tab-size:4}
#editor:focus{outline:none;border-color:#7c5cfc}
.output{background:#111118;border:1px solid #22222e;border-radius:8px;padding:20px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:0.85rem;color:#3ce096;min-height:100px;white-space:pre-wrap;word-break:break-all}
.output.error{color:#fc5c7c}
.output.empty{color:#555;font-style:italic}
.footer{color:#555;font-size:0.72rem;text-align:center;margin:20px 0}
a{color:#7c5cfc;text-decoration:none}
</style>
</head>
<body>

<h1>Pipe (SPR) Playground</h1>
<p class="subtitle">Write Pipe code. Run it in your browser. No install.</p>

<div class="container">
  <div class="toolbar">
    <button onclick="run()" id="runBtn" disabled>▶ Run</button>
    <select id="examples" onchange="loadExample()">
      <option value="">— Examples —</option>
      <option value="0">2 + 2</option>
      <option value="1">Hello World</option>
      <option value="2">Loop 1-5</option>
      <option value="3">Fibonacci</option>
      <option value="4">Function</option>
      <option value="5">Pipeline</option>
      <option value="6">Variables</option>
      <option value="7">If/Else</option>
      <option value="8">Match</option>
      <option value="9">Lists</option>
      <option value="10">Maps</option>
      <option value="11">🤖 AI: Ask</option>
      <option value="12">🤖 AI: Summarize</option>
    </select>
    <span style="color:#555;font-size:0.75rem" id="status">Loading WASM...</span>
  </div>

  <div class="key-bar">
    <select id="provider" style="background:#1a1a24;color:#e0e0e8;border:1px solid #333;border-radius:6px;padding:6px 10px;font-size:0.78rem">
      <option value="deepseek">DeepSeek</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
    </select>
    <input id="apikey" type="password" placeholder="sk-... (your API key)" style="flex:1;background:#1a1a24;color:#e0e0e8;border:1px solid #333;border-radius:6px;padding:6px 10px;font-size:0.78rem;font-family:monospace">
    <span style="color:#fc8c3c;font-size:0.68rem">⚠ Use only test keys — requests go directly to the API from your browser.</span>
  </div>

  <style>
    .key-bar { display:flex;gap:8px;align-items:center;padding:8px 0 }
  </style>

  <textarea id="editor" placeholder="Write Pipe code here..." spellcheck="false">print "Hello from Pipe Playground!"
print (2 + 2)</textarea>

  <div class="output empty" id="output">Output appears here after you click Run.</div>
</div>

<p class="footer">
  Pipe (SPR) v0.5.0 — Running in your browser via WebAssembly |
  <a href="index.html">Home</a> |
  <a href="https://github.com/MachuraHarry/pipe">GitHub</a>
</p>

<script src="wasm_exec.js"></script>
<script src="pipe-wasm.js"></script>
<script>
const examples = [
  "print (2 + 2)",
  'print "Hello from the Browser!"',
  "for i in (range 1 6)\n    print i",
  "fn fib n\n    match n\n        | 0 -> 0\n        | 1 -> 1\n        | _ -> fib(n - 1) + fib(n - 2)\n\nprint (fib 10)",
  'fn greet name\n    "Hallo " ++ name\n\nprint (greet "Welt")',
  "print (len [1,2,3])",
  "x: 10\ny: 20\nprint (x + y)",
  "if 5 > 3\n    print \"yes\"\nelse\n    print \"no\"",
  "match 2\n    | 1 -> print \"one\"\n    | 2 -> print \"two\"\n    | _ -> print \"other\"",
  "zahlen: [1,2,3]\npush zahlen 4\nprint zahlen",
  'person: {name: "Anna"}\nprint (get person "name")',
  'r: ask "Was ist die Hauptstadt von Frankreich? Antworte nur mit dem Stadtnamen."\nprint r',
  'r: summarize "Pipe ist eine Semantic Pipeline Runtime, die in Go geschrieben ist und als einzelne Binary ausgeliefert wird."\nprint r'
];

function run() {
  if (!pipeReady) return;
  const code = document.getElementById("editor").value;
  const out = document.getElementById("output");
  out.className = "output";
  out.textContent = "Running...";
  runPipe(code).then(result => {
    out.textContent = result || "(no output)";
    if (result && result.includes("Error:")) out.className = "output error";
    if (!result || result.trim() === "") out.className = "output empty";
  });
}

function loadExample() {
  const idx = parseInt(document.getElementById("examples").value);
  if (isNaN(idx)) return;
  document.getElementById("editor").value = examples[idx];
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
});
</script>
</body>
</html>
