<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe — Playground</title>
<style>
:root {
  --bg:#07070c;--bg2:#0d0d16;--bg3:#141420;
  --fg:#e8e8f0;--fg2:#9090a8;--fg3:#606078;
  --accent:#a855f7;--accent2:#7c3aed;
  --green:#3ce096;--orange:#fc8c3c;--red:#fc5c7c;
  --border:#1e1e2e;--radius:10px;
  --mono:'JetBrains Mono','Fira Code',monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}
h1{font-size:1.5rem;margin:14px 0 2px;font-weight:800;letter-spacing:-0.5px}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--fg2);font-size:.85rem;margin-bottom:20px}
.wrap{width:100%;max-width:900px}
.play-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 1px rgba(168,85,247,0.04),0 16px 48px rgba(0,0,0,0.4)}
.play-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border)}
.play-top-left{display:flex;align-items:center;gap:8px}
.play-dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.play-label{color:var(--fg3);font-size:.7rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
.play-actions{display:flex;gap:6px}
.icon-btn{background:transparent;color:var(--fg2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:.78rem;cursor:pointer;transition:all .15s;line-height:1}
.icon-btn:hover{color:var(--fg);border-color:var(--fg3)}
.icon-btn:disabled{opacity:0.4;cursor:not-allowed}
.share-btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:5px 12px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;line-height:1}
.share-btn:hover:not(:disabled){background:var(--accent);color:#fff}
.share-btn:disabled{opacity:0.4;cursor:not-allowed}
.run-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-weight:600;font-size:.78rem;cursor:pointer;transition:all .15s;line-height:1}
.run-btn:hover:not(:disabled){background:#8e72fc}
.run-btn:disabled{opacity:0.4;cursor:not-allowed}
.play-editor-wrap{display:grid;min-height:220px}
.play-editor-wrap>*{grid-area:1/1}
textarea.play-editor{width:100%;min-height:220px;padding:16px 18px;font:14px/1.7 var(--mono);background:transparent;border:none;color:transparent;caret-color:var(--fg);resize:vertical;outline:none;white-space:pre-wrap;tab-size:4;overflow:auto;z-index:2}
pre.play-editor{padding:16px 18px;font:14px/1.7 var(--mono);margin:0;color:var(--fg);overflow:hidden;pointer-events:none;user-select:none;z-index:1}
pre.play-editor::-webkit-scrollbar{display:none}
.play-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--bg3);border-top:1px solid var(--border);font-size:.7rem;color:var(--fg2);font-family:var(--mono);min-height:32px}
.play-bar.success{color:var(--green)}
.play-bar.error{color:var(--red)}
.play-out-wrap{background:var(--bg);border-top:1px solid var(--border);position:relative}
.play-out{padding:14px 18px;font:13px/1.6 var(--mono);color:var(--green);min-height:48px;max-height:220px;overflow-y:auto;white-space:pre-wrap}
.play-out.error{color:var(--red)}
.play-out:empty::before{content:"▶ output";color:var(--fg3)}
a{color:var(--accent);text-decoration:none}
.ft{color:var(--fg3);font-size:.72rem;text-align:center;margin:22px 0 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--fg);padding:10px 22px;border-radius:8px;font-size:.82rem;border:1px solid var(--border);z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;font-family:var(--sans)}
.toast.show{opacity:1}
.token.comment{color:var(--fg3);font-style:italic}
.token.string,.token.char,.token.builtin{color:var(--green)}
.token.number,.token.boolean,.token.constant{color:var(--orange)}
.token.keyword{color:var(--accent);font-weight:600}
.token.function{color:#5ce0fc}
.token.operator{color:var(--orange)}
.token.punctuation{color:var(--fg2)}
.token.variable{color:var(--fg)}
</style>
</head>
<body>
<h1>Pipe <span>Playground</span></h1>
<p class="sub">Write code. Run in browser. <a href="index.html">home</a></p>

<div class="wrap">
  <div class="play-card">
    <div class="play-top">
      <div class="play-top-left">
        <span class="play-dot" style="background:var(--red)"></span>
        <span class="play-dot" style="background:var(--orange)"></span>
        <span class="play-dot" style="background:var(--green)"></span>
        <span class="play-label">pipe playground</span>
      </div>
      <div class="play-actions">
        <button class="icon-btn" onclick="downloadCode()" title="Download .pipe file">↓</button>
        <button id="share-btn" class="share-btn" onclick="sharePlay()">Share</button>
        <button id="play-btn" class="run-btn" disabled onclick="runPlay()">▶ Run</button>
      </div>
    </div>
    <div class="play-editor-wrap">
      <textarea id="play-editor" class="play-editor" placeholder="Write Pipe code..." spellcheck="false"
oninput="onEdit()" onscroll="syncScroll()">print (2 + 2)</textarea>
      <pre id="play-hl" class="play-editor language-pipe" aria-hidden="true"></pre>
    </div>
    <div class="play-bar" id="play-bar"><span id="play-status">loading wasm…</span></div>
    <div class="play-out-wrap">
      <div class="play-out" id="play-out"></div>
    </div>
  </div>
</div>

<p class="ft"><a href="index.html">home</a> · <a href="https://github.com/MachuraHarry/pipe">github</a></p>
<div class="toast" id="toast"></div>

<script src="wasm_exec.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
Prism.languages.pipe={
  comment:/--.*/,
  string:{pattern:/"(?:[^"\\]|\\.)*"/,greedy:!0},
  number:/\b\d+(?:\.\d+)?\b/,
  keyword:/\b(?:fn|match|if|else|while|for|break|continue|import|export|enum|defer|return|try|catch|true|false|nil)\b/,
  operator:/>>|->|\+\+|\*\*|\.\.|\+=|-=|\*=|\/=|%=|==|!=|<=|>=|&&|\|\||[+\-*\/%<>=!]/,
  punctuation:/[{}[\]();,.:]/,
  'function':{pattern:/\b[a-zA-Z_]\w*(?=\s*\()/,alias:'function'},
  variable:/\b[a-zA-Z_]\w*\b/
};

let pipeReady = false;
const pipeGo = new Go();

fetch("pipe.wasm").then(r => {
  if (!r.ok) throw new Error("HTTP " + r.status);
  return WebAssembly.instantiateStreaming(r, pipeGo.importObject);
}).then(r => {
  document.getElementById("play-status").textContent = "starting…";
  pipeGo.run(r.instance);
  pipeReady = true;
  document.getElementById("play-status").textContent = "✓ ready";
  document.getElementById("play-btn").disabled = false;
  updateBar();
}).catch(e => {
  document.getElementById("play-status").textContent = "✗ " + e.message;
  console.error("WASM:", e);
  updateBar();
});

function updateBar() {
  const bar = document.getElementById("play-bar");
  const s = document.getElementById("play-status").textContent;
  if (s.startsWith("✓")) { bar.className = "play-bar success"; }
  else if (s.startsWith("✗")) { bar.className = "play-bar error"; }
  else { bar.className = "play-bar"; }
}

function runPlay() {
  const btn=document.getElementById("play-btn"),out=document.getElementById("play-out"),bar=document.getElementById("play-bar");
  if(!pipeReady||btn.disabled)return;
  btn.disabled=true;btn.textContent="⏳";
  bar.className="play-bar";bar.innerHTML='<span>executing…</span>';
  out.className="play-out";
  out.textContent="";
  setTimeout(function(){
    try{
      const code=document.getElementById("play-editor").value;
      const t0=performance.now();
      const result=pipeRun(code);
      const t1=performance.now();
      btn.disabled=false;btn.textContent="▶ Run";
      const elapsed=((t1-t0)/1000).toFixed(2);
      if(result&&(result.includes("Error:")||result.includes("Parse error"))){
        bar.className="play-bar error";
        bar.innerHTML='<span>✗ error ('+elapsed+'s)</span>';
        out.className="play-out error";
      }else{
        bar.className="play-bar success";
        bar.innerHTML='<span>✓ done ('+elapsed+'s)</span>';
        out.className="play-out";
      }
      out.textContent=result||"(no output)";
    }catch(e){
      btn.disabled=false;btn.textContent="▶ Run";
      bar.className="play-bar error";
      bar.innerHTML='<span>✗ error</span>';
      out.className="play-out error";
      out.textContent="Error: "+e.message;
    }
  },50);
}

document.getElementById("play-editor").addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter")runPlay();
});

function syncHighlight(){
  const ta=document.getElementById('play-editor'),pre=document.getElementById('play-hl');
  if(!ta||!pre)return;
  pre.innerHTML=Prism.highlight(ta.value,Prism.languages.pipe,'pipe')+'\n';
}
function syncScroll(){
  const ta=document.getElementById('play-editor'),pre=document.getElementById('play-hl');
  if(!ta||!pre)return;
  pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;
}

const STORAGE_KEY = "pipe-playground-code";

function onEdit() {
  syncHighlight();
  saveDraft();
}

function saveDraft() {
  const code = document.getElementById("play-editor").value;
  try { localStorage.setItem(STORAGE_KEY, code); } catch(e) {}
}

function loadDraft() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("code")) return;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      document.getElementById("play-editor").value = saved;
      syncHighlight();
    }
  } catch(e) {}
}

function downloadCode() {
  const code = document.getElementById("play-editor").value;
  const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "playground.pipe";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// ---------- Firebase Code-Sharing ----------

const db = firebase.database();
const statusEl = document.getElementById("play-status");

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove("show"), 3000);
}

function sha256(str) {
  const enc = new TextEncoder().encode(str);
  return crypto.subtle.digest("SHA-256", enc).then(hash =>
    Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("")
  );
}

async function sharePlay() {
  const btn = document.getElementById("share-btn");
  const code = document.getElementById("play-editor").value;
  if (!code.trim()) { showToast("No code to share"); return; }
  if (code.length > 10000) { showToast("Code too long (max 10,000 chars)"); return; }

  btn.disabled = true;
  btn.textContent = "⏳";

  try {
    const hash = await sha256(code);
    const ref = db.ref("shared/" + hash);

    try {
      await ref.set({ code, created: Date.now() });
    } catch (writeErr) {
      const snap = await ref.once("value");
      if (!snap.val()) {
        showToast("Save failed: " + writeErr.message);
        btn.disabled = false; btn.textContent = "Share";
        return;
      }
    }

    const url = window.location.origin + window.location.pathname + "?code=" + hash;
    try {
      await navigator.clipboard.writeText(url);
      showToast("Link copied!");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Link copied!");
    }
  } catch (e) {
    showToast("Error: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = "Share";
}

async function loadSharedCode() {
  const params = new URLSearchParams(window.location.search);
  const hash = params.get("code");
  if (!hash) return;

  const editor = document.getElementById("play-editor");
  statusEl.textContent = "⌛ loading shared code…";
  updateBar();

  try {
    const snap = await db.ref("shared/" + hash).once("value");
    const data = snap.val();
    if (data && data.code) {
      editor.value = data.code;
      syncHighlight();
      if (pipeReady) {
        statusEl.textContent = "✓ shared code loaded";
      } else {
        const check = setInterval(() => {
          if (pipeReady) {
            clearInterval(check);
            statusEl.textContent = "✓ shared code loaded";
            updateBar();
          }
        }, 100);
      }
      updateBar();
    } else {
      statusEl.textContent = "✗ code not found";
      updateBar();
    }
  } catch (e) {
    statusEl.textContent = "✗ load failed: " + e.message;
    updateBar();
  }
}

loadDraft();
loadSharedCode();
syncHighlight();
</script>
</body>
</html>
