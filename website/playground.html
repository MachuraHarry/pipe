<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe Playground</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{background:linear-gradient(135deg,#7c5cfc,#5ce0fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.5rem;margin:10px 0 4px}
.sub{color:#686880;font-size:.78rem;margin-bottom:16px}
.wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar select{background:#14141e;color:#e0e0e8;border:1px solid #28283a;border-radius:6px;padding:5px 10px;font-size:.78rem}
textarea{width:100%;min-height:180px;background:#0d0d16;color:#e0e0e8;border:1px solid #1e1e2e;border-radius:8px;padding:14px;font:15px/1.6 'JetBrains Mono','Fira Code',monospace;resize:vertical;tab-size:4;white-space:pre-wrap}
textarea:focus{outline:none;border-color:#7c5cfc}
.out{background:#0d0d16;border:1px solid #1e1e2e;border-radius:8px;padding:14px;font:14px/1.6 'JetBrains Mono','Fira Code',monospace;color:#3ce096;min-height:60px;white-space:pre-wrap;word-break:break-all}
.out.err{color:#fc5c7c}
.ft{color:#484860;font-size:.7rem;text-align:center;margin:16px 0}
button{background:#7c5cfc;color:#fff;border:none;border-radius:6px;padding:7px 20px;font-size:.82rem;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>

<h1>Pipe</h1>
<p class="sub">code runner — browser via WebAssembly</p>

<div class="wrap">
  <div class="bar">
    <button onclick="run()" id="runBtn" disabled>▶ Run</button>
    <select id="ex" onchange="loadEx()">
      <option value="">examples</option>
      <option value="0">2+2</option>
      <option value="1">hello</option>
      <option value="2">loop</option>
      <option value="3">fib</option>
      <option value="4">pipeline</option>
    </select>
    <span style="color:#6868a0;font-size:.72rem" id="st">loading wasm…</span>
  </div>

  <textarea id="ed" placeholder="pipe code" spellcheck="false"></textarea>
  <div class="out" id="out">output</div>
</div>

<p class="ft">v0.6 · <a href="index.html">home</a> · <a href="https://github.com/MachuraHarry/pipe">github</a></p>

<script src="wasm_exec.js"></script>
<script src="pipe-wasm.js"></script>
<script>
const ex=[
'print (2 + 2)',
'print "Hello from Pipe!"',
'for i in (range 1 6)\n    print i',
'fn fib n\n    match n\n        | 0 -> 0\n        | 1 -> 1\n        | _ -> fib(n-1)+fib(n-2)\nprint (fib 10)',
'"hello world"\n    > upper\n    > print',
];

function run(){
  if(typeof pipeReady==='undefined'||!pipeReady)return;
  const ta=document.getElementById('ed'),out=document.getElementById('out');
  out.className='out';
  out.textContent='…';
  const r=window.pipeRun(ta.value);
  out.textContent=r||'(no output)';
  if(r&&r.includes('Error:'))out.className='out err';
}

function loadEx(){
  const i=parseInt(document.getElementById('ex').value);
  if(isNaN(i))return;
  document.getElementById('ed').value=ex[i];
}

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});

document.getElementById('ed').value=ex[0];
</script>
</body>
</html>
