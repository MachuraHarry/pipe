<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe Playground — Try Pipe in your browser</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e8;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{background:linear-gradient(135deg,#7c5cfc,#5ce0fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2rem;text-align:center;margin:30px 0 5px}
.subtitle{color:#9898a8;text-align:center;margin-bottom:25px;font-size:0.9rem}
.loading{color:#fc8c3c;text-align:center;margin:40px;font-size:1.1rem}
.container{width:100%;max-width:850px;display:flex;flex-direction:column;gap:12px;padding:0 16px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar select{background:#1a1a24;color:#e0e0e8;border:1px solid #333;border-radius:6px;padding:6px 12px;font-size:0.82rem}
button{background:#7c5cfc;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#8e72fc}
button:disabled{opacity:0.4;cursor:not-allowed}

/* Syntax highlighting */
.pipe-hl .kw{color:#a78bfa;font-weight:600}
.pipe-hl .fn{color:#5ce0fc}
.pipe-hl .str{color:#3ce096}
.pipe-hl .cmt{color:#666;font-style:italic}
.pipe-hl .op{color:#fc8c3c}
.pipe-hl .num{color:#c084fc}
.pipe-hl .nil{color:#666}

/* Editor overlay */
.editor-wrap{display:grid;min-height:220px}
.editor-wrap>*{grid-area:1/1}
.editor-wrap textarea{width:100%;min-height:220px;background:transparent;color:transparent;caret-color:#5ce0fc;border:1px solid #22222e;border-radius:8px;padding:16px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:0.88rem;resize:vertical;tab-size:4;z-index:2;white-space:pre-wrap;overflow:auto;line-height:1.6}
.editor-wrap textarea:focus{outline:none;border-color:#7c5cfc}
.editor-wrap pre{min-height:220px;border:1px solid transparent;border-radius:8px;padding:16px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:0.88rem;z-index:1;pointer-events:none;user-select:none;overflow:hidden;white-space:pre-wrap;line-height:1.6;margin:0;color:#e0e0e8}
.editor-wrap pre::-webkit-scrollbar{display:none}

.output{background:#111118;border:1px solid #22222e;border-radius:8px;padding:20px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:0.85rem;color:#3ce096;min-height:100px;white-space:pre-wrap;word-break:break-all}
.output.error{color:#fc5c7c}
.output.empty{color:#555;font-style:italic}
.footer{color:#555;font-size:0.72rem;text-align:center;margin:20px 0}
a{color:#7c5cfc;text-decoration:none}
</style>
</head>
<body>

<h1>Pipe (SPR) Playground</h1>
<p class="subtitle">Write Pipe code. Run it in your browser. No install.</p>

<div class="container">
  <div class="toolbar">
    <button onclick="run()" id="runBtn" disabled>▶ Run</button>
    <select id="examples" onchange="loadExample()">
      <option value="">— Examples —</option>
      <option value="0">2 + 2</option>
      <option value="1">Hello World</option>
      <option value="2">Loop 1-5</option>
      <option value="3">Fibonacci</option>
      <option value="4">Function</option>
      <option value="5">Pipeline</option>
      <option value="6">Variables</option>
      <option value="7">If/Else</option>
      <option value="8">Match</option>
      <option value="9">Lists</option>
      <option value="10">Maps</option>
    </select>
    <span style="color:#555;font-size:0.75rem" id="status">Loading WASM...</span>
  </div>

  <div class="editor-wrap">
    <textarea id="editor" placeholder="Write Pipe code here..." spellcheck="false"
oninput="syncHighlight()" onscroll="syncScroll()">print "Hello from Pipe Playground!"
print (2 + 2)</textarea>
    <pre id="editor-hl" class="pipe-hl" aria-hidden="true"></pre>
  </div>

  <div class="output empty" id="output">Output appears here after you click Run.</div>
</div>

<p class="footer">
  Pipe (SPR) v0.6.0 — Running in your browser via WebAssembly |
  <a href="index.html">Home</a> |
  <a href="https://github.com/MachuraHarry/pipe">GitHub</a>
</p>

<script src="wasm_exec.js"></script>
<script src="pipe-wasm.js"></script>
<script>
const examples = [
  "print (2 + 2)",
  'print "Hello from the Browser!"',
  "for i in (range 1 6)\n    print i",
  "fn fib n\n    match n\n        | 0 -> 0\n        | 1 -> 1\n        | _ -> fib(n - 1) + fib(n - 2)\n\nprint (fib 10)",
  'fn greet name\n    "Hallo " ++ name\n\nprint (greet "Welt")',
  "print (len [1,2,3])",
  "x: 10\ny: 20\nprint (x + y)",
  "if 5 > 3\n    print \"yes\"\nelse\n    print \"no\"",
  "match 2\n    | 1 -> print \"one\"\n    | 2 -> print \"two\"\n    | _ -> print \"other\"",
  "zahlen: [1,2,3]\npush zahlen 4\nprint zahlen",
  'person: {name: "Anna"}\nprint (get person "name")'
];

function run() {
  if (!pipeReady) return;
  const code = document.getElementById("editor").value;
  const out = document.getElementById("output");
  out.className = "output";
  out.textContent = "Running...";
  runPipe(code).then(result => {
    out.textContent = result || "(no output)";
    if (result && result.includes("Error:")) out.className = "output error";
    if (!result || result.trim() === "") out.className = "output empty";
  });
}

function loadExample() {
  const idx = parseInt(document.getElementById("examples").value);
  if (isNaN(idx)) return;
  document.getElementById("editor").value = examples[idx];
  syncHighlight();
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
});

// Pipe Syntax Highlighting
var PIPE_KW=['fn','match','if','else','while','for','break','continue','import','export','enum','defer','return','try','catch'];
var PIPE_OPS=['>>','->','++','**','..','+=','-=','*=','/=','%=','==','!=','<=','>=','&&','||'];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function highlightPipe(code){
  var out='',i=0;
  while(i<code.length){
    var c=code[i];
    if(c==='-'&&code[i+1]==='-'){
      var e=code.indexOf('\n',i);if(e===-1)e=code.length;
      out+='<span class="cmt">'+esc(code.slice(i,e))+'</span>';
      i=e;continue;
    }
    if(c==='"'){
      var s=i;i++;
      while(i<code.length&&code[i]!=='"'){if(code[i]==='\\')i++;i++;}
      i++;out+='<span class="str">'+esc(code.slice(s,i))+'</span>';continue;
    }
    if(/\d/.test(c)&&(i===0||/[^\w.]/.test(code[i-1]))){
      var s=i;while(i<code.length&&/[\d.]/.test(code[i]))i++;
      out+='<span class="num">'+esc(code.slice(s,i))+'</span>';continue;
    }
    var m=0;
    for(var j=0;j<PIPE_OPS.length;j++){
      var o=PIPE_OPS[j];
      if(code.slice(i,i+o.length)===o){
        out+='<span class="op">'+esc(o)+'</span>';i+=o.length;m=1;break;
      }
    }
    if(m)continue;
    if(code[i]==='>'||code[i]==='<'||code[i]==='+'||code[i]==='-'||code[i]==='*'||code[i]==='/'||code[i]==='%'||code[i]==='='||code[i]==='!'){
      out+='<span class="op">'+esc(code[i])+'</span>';i++;continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      var s=i;while(i<code.length&&/\w/.test(code[i]))i++;
      var w=code.slice(s,i);
      if(PIPE_KW.indexOf(w)!==-1)out+='<span class="kw">'+w+'</span>';
      else if(w==='nil'||w==='true'||w==='false')out+='<span class="nil">'+w+'</span>';
      else if(i<code.length&&/\s*\(/.test(code.slice(i)))out+='<span class="fn">'+w+'</span>';
      else out+=esc(w);
      continue;
    }
    out+=esc(c);i++;
  }
  return out;
}

function syncHighlight(){
  var ta=document.getElementById('editor');
  var pre=document.getElementById('editor-hl');
  if(!ta||!pre)return;
  pre.innerHTML=highlightPipe(ta.value+'\n');
}

function syncScroll(){
  var ta=document.getElementById('editor');
  var pre=document.getElementById('editor-hl');
  if(!ta||!pre)return;
  pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;
}

(function(){
  var ta=document.getElementById('editor');
  if(ta){ta.addEventListener('scroll',syncScroll);syncHighlight();}
})();
</script>
</body>
</html>
